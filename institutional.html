<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Akkreditatsiya Monitoringi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   INSTITUTSIONAL AKKREDITATSIYA MONITORINGI
   Design tokens
   ============================================================ */
:root{
  color-scheme: light;
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  /* page planes — cool-biased neutrals */
  --plane:        #F1F4F7;
  --surface:      #FFFFFF;
  --surface-2:    #F7F9FB;
  --surface-3:    #EAEFF4;
  --border:       #DDE4EC;
  --border-strong:#C4D0DC;

  /* ink */
  --ink:          #101B27;
  --ink-2:        #55606D;
  --ink-3:        #7C8794;

  /* institutional accent (chrome, links, focus) */
  --accent:       #1B4F82;
  --accent-soft:  #E7EFF8;
  --accent-ink:   #10395F;

  /* chrome: sidebar keeps its own fixed dark set in both themes */
  --nav-bg:       #0D1826;
  --nav-bg-2:     #16243A;
  --nav-ink:      #B7C4D4;
  --nav-ink-2:    #6E7F94;
  --nav-ink-hi:   #FFFFFF;
  --nav-gold:     #D4AF57;
  --nav-border:   #1E2E45;

  /* semantic status — fixed, never themed (spec §5) */
  --st-active:    #16A34A;
  --st-soon:      #F59E0B;
  --st-overdue:   #DC2626;
  --st-progress:  #2563EB;
  --st-nodata:    #94A3B8;
  --st-active-bg:  #E8F6ED;
  --st-soon-bg:    #FDF3E0;
  --st-overdue-bg: #FCEBEB;
  --st-progress-bg:#E7EEFD;
  --st-nodata-bg:  #EFF2F6;

  /* risk */
  --risk-low:     #16A34A;
  --risk-med:     #F59E0B;
  --risk-high:    #DC2626;

  /* sequential blue ramp (magnitude: map, heatmaps) */
  --seq-0:#EEF4FB; --seq-1:#CDE2FB; --seq-2:#9EC5F4; --seq-3:#6DA7EC;
  --seq-4:#3987E5; --seq-5:#256ABF; --seq-6:#184F95; --seq-7:#0D366B;

  /* categorical (ownership, level) — validated slots 1–3 */
  --cat-1:#2A78D6; --cat-2:#EB6834; --cat-3:#1BAF7A;

  --grid:         #E4EAF1;
  --axis:         #C4D0DC;
  --shadow-sm: 0 1px 2px rgba(16,27,39,.06), 0 1px 3px rgba(16,27,39,.04);
  --shadow-md: 0 2px 4px rgba(16,27,39,.05), 0 8px 20px rgba(16,27,39,.07);
  --shadow-lg: 0 12px 40px rgba(16,27,39,.16);
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --nav-w: 258px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:        #0A0E14;
    --surface:      #121924;
    --surface-2:    #172030;
    --surface-3:    #1E2938;
    --border:       #24303F;
    --border-strong:#334254;
    --ink:          #EDF2F8;
    --ink-2:        #A3B0C0;
    --ink-3:        #7A8798;
    --accent:       #6BA6E8;
    --accent-soft:  #16273C;
    --accent-ink:   #9CC5F3;
    --st-active-bg:  #102A1B;
    --st-soon-bg:    #2E2410;
    --st-overdue-bg: #2E1414;
    --st-progress-bg:#131F3C;
    --st-nodata-bg:  #1B2432;
    --seq-0:#111C2B; --seq-1:#152945; --seq-2:#1A3860; --seq-3:#20497E;
    --seq-4:#2A5D9E; --seq-5:#3675BF; --seq-6:#4A8FDB; --seq-7:#6BA6E8;
    --cat-1:#3987E5; --cat-2:#D95926; --cat-3:#199E70;
    --grid:         #202B3A;
    --axis:         #334254;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 2px 6px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 14px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:        #0A0E14;
  --surface:      #121924;
  --surface-2:    #172030;
  --surface-3:    #1E2938;
  --border:       #24303F;
  --border-strong:#334254;
  --ink:          #EDF2F8;
  --ink-2:        #A3B0C0;
  --ink-3:        #7A8798;
  --accent:       #6BA6E8;
  --accent-soft:  #16273C;
  --accent-ink:   #9CC5F3;
  --st-active-bg:  #102A1B;
  --st-soon-bg:    #2E2410;
  --st-overdue-bg: #2E1414;
  --st-progress-bg:#131F3C;
  --st-nodata-bg:  #1B2432;
  --seq-0:#111C2B; --seq-1:#152945; --seq-2:#1A3860; --seq-3:#20497E;
  --seq-4:#2A5D9E; --seq-5:#3675BF; --seq-6:#4A8FDB; --seq-7:#6BA6E8;
  --cat-1:#3987E5; --cat-2:#D95926; --cat-3:#199E70;
  --grid:         #202B3A;
  --axis:         #334254;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 2px 6px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 14px 44px rgba(0,0,0,.6);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color: var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
::selection{ background: var(--accent-soft); }
.num{ font-variant-numeric: tabular-nums; }
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr{ position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

/* ============================ SHELL ============================ */
.app{ display:grid; grid-template-columns: var(--nav-w) minmax(0,1fr); min-height:100vh; }

/* ---- sidebar ---- */
.nav{
  background: var(--nav-bg); color: var(--nav-ink);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow:hidden;
  border-right:1px solid var(--nav-border);
}
.nav-brand{ display:flex; gap:11px; align-items:flex-start; padding:18px 16px 16px; border-bottom:1px solid var(--nav-border); }
.brand-mark{
  flex:none; width:36px; height:36px; border-radius:9px;
  background: linear-gradient(150deg, var(--nav-gold), #A8822F);
  display:grid; place-items:center; color:#1A1206; font-weight:700; font-size:15px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-text b{ display:block; color:var(--nav-ink-hi); font-size:12.5px; font-weight:600; line-height:1.3; letter-spacing:.01em; }
.brand-text span{ display:block; color:var(--nav-ink-2); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; margin-top:3px; }
.nav-scroll{ flex:1; overflow-y:auto; padding:10px 10px 16px; scrollbar-width:thin; }
.nav-scroll::-webkit-scrollbar{ width:6px; }
.nav-scroll::-webkit-scrollbar-thumb{ background:#24374F; border-radius:3px; }
.nav-group{ color:var(--nav-ink-2); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; padding:14px 8px 6px; }
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; margin:1px 0; border:0; border-radius:8px; cursor:pointer;
  background:transparent; color:var(--nav-ink); font-size:13px; font-weight:500;
  position:relative; transition: background .13s ease, color .13s ease;
}
.nav-item:hover{ background:var(--nav-bg-2); color:var(--nav-ink-hi); }
.nav-item .ico{ flex:none; width:17px; height:17px; opacity:.72; }
.nav-item .lbl{ flex:1; min-width:0; }
.nav-item .cnt{ font-size:10.5px; font-weight:600; color:var(--nav-ink-2); font-variant-numeric:tabular-nums; }
.nav-item[aria-current="page"]{ background:var(--nav-bg-2); color:var(--nav-ink-hi); }
.nav-item[aria-current="page"] .ico{ opacity:1; color:var(--nav-gold); }
.nav-item[aria-current="page"]::before{
  content:""; position:absolute; left:-10px; top:6px; bottom:6px; width:3px;
  background:var(--nav-gold); border-radius:0 3px 3px 0;
}
.nav-item .dot{ width:7px;height:7px;border-radius:50%;flex:none; }
.nav-foot{ padding:11px 16px; border-top:1px solid var(--nav-border); color:var(--nav-ink-2); font-size:10.5px; }
.nav-foot b{ color:var(--nav-ink); font-weight:600; }

/* ---- header ---- */
.main{ min-width:0; display:flex; flex-direction:column; }
.hdr{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:10px 22px; min-height:60px;
}
.hdr-title{ min-width:0; flex:none; max-width:34%; }
.hdr-title h1{ margin:0; font-size:16px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-title p{ margin:1px 0 0; font-size:11.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-spacer{ flex:1; }
.gsearch{ position:relative; flex:1; max-width:340px; }
.gsearch input{
  width:100%; padding:7px 30px 7px 32px; border:1px solid var(--border);
  background:var(--surface-2); border-radius:8px; font-size:13px;
}
.gsearch input::placeholder{ color:var(--ink-3); }
.gsearch .ico{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px;height:15px; color:var(--ink-3); }
.gsearch .clr{ position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0;background:transparent;cursor:pointer;color:var(--ink-3); padding:2px; display:none; }
.gsearch.has .clr{ display:block; }
.gsearch-res{
  position:absolute; top:calc(100% + 5px); left:0; right:0; background:var(--surface);
  border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg);
  max-height:340px; overflow-y:auto; z-index:60; display:none;
}
.gsearch-res.open{ display:block; }
.gsearch-res button{ display:block; width:100%; text-align:left; border:0; background:transparent; padding:8px 11px; cursor:pointer; border-bottom:1px solid var(--border); font-size:12.5px; }
.gsearch-res button:hover{ background:var(--surface-2); }
.gsearch-res button small{ display:block; color:var(--ink-3); font-size:11px; }
.hdr-date{ font-size:11.5px; color:var(--ink-2); text-align:right; line-height:1.25; flex:none; }
.hdr-date b{ display:block; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }

.iconbtn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
  width:34px;height:34px; border-radius:8px; display:grid;place-items:center; cursor:pointer; position:relative; flex:none;
}
.iconbtn:hover{ background:var(--surface-3); color:var(--ink); }
.iconbtn svg{ width:17px;height:17px; }
.iconbtn .badge{
  position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--st-overdue); color:#fff; font-size:10px; font-weight:700;
  display:grid;place-items:center; border:2px solid var(--surface);
}
.langsel{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-2); flex:none; }
.langsel button{
  border:0; background:transparent; padding:6px 8px; font-size:11px; font-weight:600;
  cursor:pointer; color:var(--ink-3); letter-spacing:.02em;
}
.langsel button + button{ border-left:1px solid var(--border); }
.langsel button[aria-pressed="true"]{ background:var(--accent); color:#fff; }
:root[data-theme="dark"] .langsel button[aria-pressed="true"],
:root:not([data-theme="light"]) .langsel button[aria-pressed="true"]{ color:#0A0E14; }

/* ---- global filter bar ---- */
.gfilters{
  position:sticky; top:60px; z-index:35; background:var(--surface-2);
  border-bottom:1px solid var(--border); padding:9px 22px;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.gf-label{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); margin-right:2px; }
.btn{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  padding:6px 11px; border-radius:8px; font-size:12.5px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{ background:var(--surface-3); }
.btn svg{ width:14px;height:14px; opacity:.7; }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
:root[data-theme="dark"] .btn.pri, :root:not([data-theme="light"]) .btn.pri{ color:#0A0E14; }
.btn.pri:hover{ filter:brightness(1.08); }
.btn.sm{ padding:4px 8px; font-size:11.5px; }
.btn[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* multiselect dropdown */
.ms{ position:relative; }
.ms-btn{ border:1px solid var(--border-strong); background:var(--surface); border-radius:8px; padding:6px 9px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap; }
.ms-btn .cap{ color:var(--ink-2); }
.ms-btn .val{ font-weight:600; }
.ms-btn .chev{ width:13px;height:13px; opacity:.55; }
.ms-btn.active{ border-color:var(--accent); background:var(--accent-soft); }
.ms-pop{
  position:absolute; top:calc(100% + 5px); left:0; min-width:245px; max-height:330px; overflow-y:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow-lg); z-index:70; padding:5px; display:none;
}
.ms-pop.open{ display:block; }
.ms-pop label{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; }
.ms-pop label:hover{ background:var(--surface-2); }
.ms-pop input{ accent-color:var(--accent); width:14px;height:14px; flex:none; }
.ms-pop .n{ margin-left:auto; color:var(--ink-3); font-size:11px; font-variant-numeric:tabular-nums; }
.ms-pop .sep{ height:1px; background:var(--border); margin:4px 0; }
.ms-pop .act{ display:flex; gap:6px; padding:4px 6px; }

.chips{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 6px 3px 9px;
  background:var(--accent-soft); color:var(--accent-ink); border:1px solid var(--border);
  border-radius:20px; font-size:11.5px; font-weight:500;
}
.chip button{ border:0;background:transparent;cursor:pointer;color:inherit;padding:0 1px; line-height:1; font-size:14px; opacity:.65; }
.chip button:hover{ opacity:1; }

/* ---- content ---- */
.content{ padding:20px 22px 56px; flex:1; }
.page-intro{ margin:0 0 16px; }
.page-intro h2{ margin:0; font-size:19px; font-weight:600; letter-spacing:-.015em; text-wrap:balance; }
.page-intro p{ margin:4px 0 0; color:var(--ink-2); font-size:13px; max-width:76ch; }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
}
.card-h{ display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border); }
.card-h h3{ margin:0; font-size:13.5px; font-weight:600; letter-spacing:-.005em; }
.card-h p{ margin:2px 0 0; font-size:11.5px; color:var(--ink-3); }
.card-h .sp{ flex:1; }
.card-b{ padding:16px; }
.card-b.flush{ padding:0; }

.grid{ display:grid; gap:14px; }
.g-kpi{ grid-template-columns: repeat(auto-fit, minmax(178px,1fr)); }
.g-2{ grid-template-columns: repeat(auto-fit, minmax(380px,1fr)); }
.g-3{ grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); }
.g-4{ grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); }
.mb{ margin-bottom:16px; }
.mt{ margin-top:16px; }

/* ---- KPI tiles ---- */
.kpi{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border-strong);
  border-radius:var(--r-md); padding:13px 15px; text-align:left; cursor:pointer;
  display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow-sm);
  transition: box-shadow .14s ease, transform .14s ease;
}
.kpi:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
.kpi .k-lab{ font-size:11.5px; color:var(--ink-2); font-weight:500; display:flex; align-items:center; gap:6px; min-height:32px; }
.kpi .k-val{ font-size:30px; font-weight:600; letter-spacing:-.03em; line-height:1.05; margin-top:4px; }
.kpi .k-sub{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.kpi .k-bar{ height:3px; border-radius:2px; background:var(--surface-3); overflow:hidden; margin-top:7px; }
.kpi .k-bar i{ display:block; height:100%; border-radius:2px; }
.kpi[data-tone="total"]  { border-left-color:var(--accent); }
.kpi[data-tone="active"] { border-left-color:var(--st-active); }
.kpi[data-tone="soon"]   { border-left-color:var(--st-soon); }
.kpi[data-tone="overdue"]{ border-left-color:var(--st-overdue); }
.kpi[data-tone="progress"]{border-left-color:var(--st-progress); }
.kpi[data-tone="nodata"] { border-left-color:var(--st-nodata); }
.kpi[data-tone="neutral"]{ border-left-color:var(--border-strong); }

/* ---- status pill (colour + icon + text, never colour alone) ---- */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 6px;
  border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap;
  border:1px solid transparent; line-height:1.6;
}
.pill .gl{ font-size:9px; line-height:1; }
.pill[data-s="active"]  { background:var(--st-active-bg);  color:#0F7A38; border-color:rgba(22,163,74,.28); }
.pill[data-s="soon"]    { background:var(--st-soon-bg);    color:#95620A; border-color:rgba(245,158,11,.32); }
.pill[data-s="overdue"] { background:var(--st-overdue-bg); color:#B01C1C; border-color:rgba(220,38,38,.28); }
.pill[data-s="progress"]{ background:var(--st-progress-bg);color:#1A4CC0; border-color:rgba(37,99,235,.28); }
.pill[data-s="nodata"]  { background:var(--st-nodata-bg);  color:#5B6779; border-color:rgba(148,163,184,.35); }
.pill[data-s="closed"]  { background:var(--st-nodata-bg);  color:#475569; border-color:rgba(100,116,139,.45); text-decoration:line-through; text-decoration-thickness:1px; }
:root[data-theme="dark"] .pill[data-s="active"], :root:not([data-theme="light"]) .pill[data-s="active"]{ color:#5DD68B; }
:root[data-theme="dark"] .pill[data-s="soon"], :root:not([data-theme="light"]) .pill[data-s="soon"]{ color:#F5B93F; }
:root[data-theme="dark"] .pill[data-s="overdue"], :root:not([data-theme="light"]) .pill[data-s="overdue"]{ color:#F58080; }
:root[data-theme="dark"] .pill[data-s="progress"], :root:not([data-theme="light"]) .pill[data-s="progress"]{ color:#7FA9F5; }
:root[data-theme="dark"] .pill[data-s="nodata"], :root:not([data-theme="light"]) .pill[data-s="nodata"]{ color:#A3B0C0; }
:root[data-theme="dark"] .pill[data-s="closed"], :root:not([data-theme="light"]) .pill[data-s="closed"]{ color:#94A3B8; }
.kpi[data-tone="closed"]{ border-left-color:var(--st-nodata); }

.tag{ display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:5px; background:var(--surface-3); color:var(--ink-2); font-size:11px; font-weight:500; }
.tag.risk-low{ background:var(--st-active-bg); color:#0F7A38; }
.tag.risk-med{ background:var(--st-soon-bg); color:#95620A; }
.tag.risk-high{ background:var(--st-overdue-bg); color:#B01C1C; }
:root[data-theme="dark"] .tag.risk-low, :root:not([data-theme="light"]) .tag.risk-low{ color:#5DD68B; }
:root[data-theme="dark"] .tag.risk-med, :root:not([data-theme="light"]) .tag.risk-med{ color:#F5B93F; }
:root[data-theme="dark"] .tag.risk-high, :root:not([data-theme="light"]) .tag.risk-high{ color:#F58080; }

/* ---- focus panel ---- */
.focus{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
.focus-h{ display:flex; align-items:center; gap:9px; padding:11px 16px; border-bottom:1px solid var(--border); background:var(--surface-2); }
.focus-h .dotp{ width:8px;height:8px;border-radius:50%;background:var(--st-overdue); box-shadow:0 0 0 3px var(--st-overdue-bg); }
.focus-h h3{ margin:0; font-size:13px; font-weight:600; }
.focus-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
.focus-cell{ padding:13px 16px; border-right:1px solid var(--border); text-align:left; background:transparent; border-top:0;border-bottom:0;border-left:0; cursor:pointer; }
.focus-cell:last-child{ border-right:0; }
.focus-cell:hover{ background:var(--surface-2); }
.focus-cell .fv{ font-size:24px; font-weight:600; letter-spacing:-.025em; }
.focus-cell .fl{ font-size:11.5px; color:var(--ink-2); display:flex; align-items:center; gap:6px; margin-top:2px; }

/* ---- insights ---- */
.insights{ display:flex; flex-direction:column; }
.insight{ display:flex; gap:11px; padding:11px 16px; border-bottom:1px solid var(--border); font-size:13px; line-height:1.5; }
.insight:last-child{ border-bottom:0; }
.insight .ib{ flex:none; width:22px;height:22px;border-radius:6px; display:grid;place-items:center; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-ink); }
.insight b{ font-weight:600; }

/* ---- charts ---- */
.chart-box{ position:relative; }
.chart-box.h240{ height:240px; } .chart-box.h280{ height:280px; }
.chart-box.h320{ height:320px; } .chart-box.h420{ height:420px; }
.legend{ display:flex; flex-wrap:wrap; gap:10px 16px; padding:10px 16px 0; }
.legend button{ display:inline-flex; align-items:center; gap:6px; border:0;background:transparent;cursor:pointer; font-size:11.5px; color:var(--ink-2); padding:0; }
.legend button .sw{ width:10px;height:10px;border-radius:3px; flex:none; }
.legend button.off{ opacity:.4; text-decoration:line-through; }

/* ---- tile map ---- */
.map-wrap{ overflow-x:auto; padding:6px 0; }
.tilemap{ display:grid; grid-template-columns:repeat(7,minmax(94px,1fr)); grid-auto-rows:70px; gap:6px; min-width:700px; }
.tile{
  border:1px solid var(--border); border-radius:8px; padding:7px 8px; cursor:pointer;
  display:flex; flex-direction:column; justify-content:space-between; text-align:left;
  position:relative; overflow:hidden; transition:transform .12s ease, box-shadow .12s ease;
}
.tile:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); z-index:2; }
.tile .tn{ font-size:10.5px; font-weight:600; line-height:1.2; }
.tile .tv{ font-size:19px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.tile .tstrip{ display:flex; gap:1.5px; height:3px; border-radius:2px; overflow:hidden; }
.tile .tstrip i{ display:block; height:100%; }
.tile.sel{ outline:2px solid var(--accent); outline-offset:1px; }
.mapscale{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-3); margin-top:11px; flex-wrap:wrap; }
.mapscale .ramp{ display:flex; }
.mapscale .ramp i{ width:20px;height:9px; display:block; }
.mapscale .ramp i:first-child{ border-radius:3px 0 0 3px; } .mapscale .ramp i:last-child{ border-radius:0 3px 3px 0; }

/* ---- generic table ---- */
.tbl-scroll{ overflow-x:auto; max-width:100%; }
table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.tbl th, table.tbl td{ padding:8px 11px; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle; }
table.tbl th{
  background:var(--surface-2); font-weight:600; font-size:11px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-2); white-space:nowrap; position:sticky; top:0; z-index:5;
}
table.tbl th.sortable{ cursor:pointer; user-select:none; }
table.tbl th.sortable:hover{ color:var(--ink); }
table.tbl th .sa{ opacity:.35; margin-left:3px; }
table.tbl th[aria-sort] .sa{ opacity:1; color:var(--accent); }
table.tbl tbody tr:hover{ background:var(--surface-2); }
table.tbl td.num, table.tbl th.num{ text-align:right; font-variant-numeric:tabular-nums; }
table.tbl td.name{ min-width:250px; max-width:420px; }
table.tbl .lnk{ background:transparent;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-weight:500;font-size:12.5px; }
table.tbl .lnk:hover{ color:var(--accent); text-decoration:underline; }
table.tbl tr[data-flag="overdue"] td:first-child{ box-shadow: inset 3px 0 0 var(--st-overdue); }
table.tbl tr[data-flag="soon"] td:first-child{ box-shadow: inset 3px 0 0 var(--st-soon); }
table.tbl tr[data-flag="progress"] td:first-child{ box-shadow: inset 3px 0 0 var(--st-progress); }
.tbl-foot{ display:flex; align-items:center; gap:9px; padding:10px 14px; border-top:1px solid var(--border); flex-wrap:wrap; }
.tbl-foot .info{ font-size:12px; color:var(--ink-2); }
.pager{ display:flex; gap:3px; margin-left:auto; align-items:center; }
.pager button{ border:1px solid var(--border); background:var(--surface); min-width:29px; height:29px; border-radius:6px; cursor:pointer; font-size:12px; font-variant-numeric:tabular-nums; }
.pager button[aria-current="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
:root[data-theme="dark"] .pager button[aria-current="true"], :root:not([data-theme="light"]) .pager button[aria-current="true"]{ color:#0A0E14; }
.pager button:disabled{ opacity:.4; cursor:not-allowed; }
.empty{ padding:44px 20px; text-align:center; color:var(--ink-3); font-size:13px; }
.empty svg{ width:34px;height:34px; opacity:.4; display:block; margin:0 auto 10px; }

/* ---- timeline ---- */
.tl-wrap{ overflow-x:auto; overflow-y:visible; }
.tl-inner{ min-width:940px; position:relative; }
.tl-axis{
  position:sticky; top:0; z-index:12; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; height:38px; padding-left:var(--tl-lw,300px);
}
.tl-axis .yr{ flex:1; border-left:1px solid var(--border); font-size:11px; font-weight:600; color:var(--ink-2); padding:4px 0 0 7px; position:relative; }
.tl-axis .yr .q{ position:absolute; bottom:3px; font-size:9px; color:var(--ink-3); }
.tl-group{ position:sticky; top:38px; z-index:11; }
.tl-group button{
  width:100%; display:flex; align-items:center; gap:8px; padding:7px 14px; border:0;
  background:var(--surface-3); cursor:pointer; font-size:12px; font-weight:600; text-align:left;
  border-top:1px solid var(--border); border-bottom:1px solid var(--border);
}
.tl-group .cnt{ margin-left:auto; color:var(--ink-3); font-weight:500; font-variant-numeric:tabular-nums; font-size:11px; }
.tl-row{ display:flex; align-items:stretch; border-bottom:1px solid var(--border); min-height:30px; }
.tl-row:hover{ background:var(--surface-2); }
.tl-lab{
  width:var(--tl-lw,300px); flex:none; padding:6px 10px 6px 14px; font-size:12px;
  display:flex; align-items:center; gap:7px; border-right:1px solid var(--border);
  position:sticky; left:0; background:inherit; z-index:6;
}
.tl-row .tl-lab{ background:var(--surface); }
.tl-row:hover .tl-lab{ background:var(--surface-2); }
.tl-lab .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.tl-lab .nm:hover{ color:var(--accent); text-decoration:underline; }
.tl-track{ flex:1; position:relative; min-height:30px; }
.tl-track .gl{ position:absolute; top:0; bottom:0; width:1px; background:var(--grid); }
.tl-track .gl.now{ background:var(--accent); width:2px; opacity:.85; }
.tl-bar{ position:absolute; top:50%; transform:translateY(-50%); height:8px; border-radius:4px; opacity:.4; }
.tl-mk{
  position:absolute; top:50%; transform:translate(-50%,-50%); width:11px;height:11px;
  border-radius:50%; border:2px solid var(--surface); cursor:pointer; z-index:3;
}
.tl-mk:hover{ transform:translate(-50%,-50%) scale(1.35); }
.tl-dt{
  position:absolute; top:50%; transform:translateY(-50%); font-size:10.5px; font-weight:600;
  font-family:var(--font-mono); white-space:nowrap; color:var(--ink-2); pointer-events:none;
}
.tl-off{ position:absolute; top:50%; transform:translateY(-50%); font-size:10.5px; color:var(--ink-3); white-space:nowrap; }
/* tugash sanasi — marker ustida, markazlangan (ranglar qoʻshilgan nuqta) */
.tl-dt-top{ transform:translate(-50%,-150%); font-size:9.5px; background:var(--surface); padding:0 3px; border-radius:3px; line-height:1.2; z-index:2; }
.tl-row{ min-height:34px; }
.tl-track{ min-height:34px; }

/* ---- year planner matrix ---- */
.matrix{ border-collapse:separate; border-spacing:4px; width:100%; }
.matrix th{ font-size:11px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:.06em; padding:3px; }
.matrix td.yl{ font-weight:600; font-size:13px; text-align:left; padding-right:8px; font-variant-numeric:tabular-nums; }
.matrix td.cell{ padding:0; }
.matrix td.cell button{
  width:100%; border:1px solid var(--border); border-radius:8px; padding:11px 6px; cursor:pointer;
  font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; display:block;
}
.matrix td.cell button:hover{ outline:2px solid var(--accent); outline-offset:-1px; }
.matrix td.tot{ font-weight:600; font-variant-numeric:tabular-nums; padding-left:8px; }

/* ---- calendar ---- */
.cal-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.cal-mo{ border:1px solid var(--border); border-radius:10px; padding:10px; }
.cal-mo h4{ margin:0 0 7px; font-size:12px; font-weight:600; display:flex; }
.cal-mo h4 span{ margin-left:auto; color:var(--ink-3); font-weight:500; font-variant-numeric:tabular-nums; }
.cal-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-days .dh{ font-size:9px; color:var(--ink-3); text-align:center; padding-bottom:2px; }
.cal-d{ aspect-ratio:1; border:0; border-radius:4px; background:var(--surface-2); font-size:10px; cursor:default; display:grid;place-items:center; color:var(--ink-3); position:relative; font-variant-numeric:tabular-nums; }
.cal-d.has{ cursor:pointer; font-weight:600; color:var(--ink); }
.cal-d.has:hover{ outline:2px solid var(--accent); }
.cal-d.today{ box-shadow: inset 0 0 0 2px var(--accent); }

/* heatmap cells */
.hm{ display:grid; grid-template-columns:repeat(13,minmax(0,1fr)); gap:3px; min-width:620px; }
.hm .hh{ font-size:10px; color:var(--ink-3); text-align:center; }
.hm .hy{ font-size:11px; font-weight:600; display:flex; align-items:center; font-variant-numeric:tabular-nums; }
.hm button{ border:1px solid var(--border); border-radius:5px; aspect-ratio:1.5; cursor:pointer; font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums; padding:0; }
.hm button:hover{ outline:2px solid var(--accent); outline-offset:-1px; }

/* ---- drawer ---- */
.scrim{ position:fixed; inset:0; background:rgba(9,15,23,.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .18s ease; backdrop-filter:blur(1.5px); }
.scrim.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(470px,100%); background:var(--surface);
  border-left:1px solid var(--border); z-index:91; transform:translateX(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
}
.drawer.open{ transform:translateX(0); }
.drawer-h{ padding:15px 18px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start; }
.drawer-h h3{ margin:0; font-size:15px; font-weight:600; line-height:1.35; text-wrap:balance; }
.drawer-h .meta{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
.drawer-b{ overflow-y:auto; padding:0 0 24px; flex:1; }
.dsec{ padding:14px 18px; border-bottom:1px solid var(--border); }
.dsec h4{ margin:0 0 10px; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); }
.dl{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:13px; }
.dl dt{ color:var(--ink-2); }
.dl dd{ margin:0; font-weight:500; text-align:right; }
.dl dd.mono{ font-family:var(--font-mono); font-size:12.5px; }
.bigstat{ display:flex; align-items:baseline; gap:9px; margin-bottom:4px; }
.bigstat .v{ font-size:27px; font-weight:600; letter-spacing:-.03em; }
.bigstat .u{ font-size:12.5px; color:var(--ink-2); }
.riskbar{ height:7px; border-radius:4px; background:var(--surface-3); overflow:hidden; margin:8px 0 5px; position:relative; }
.riskbar i{ display:block; height:100%; border-radius:4px; }
.warnlist{ display:flex; flex-direction:column; gap:7px; }
.warn{ display:flex; gap:8px; font-size:12.5px; padding:8px 10px; border-radius:8px; background:var(--st-soon-bg); border:1px solid rgba(245,158,11,.3); color:var(--ink); }
.warn.crit{ background:var(--st-overdue-bg); border-color:rgba(220,38,38,.28); }
.warn.info{ background:var(--accent-soft); border-color:var(--border); }
.warn .wi{ flex:none; font-weight:700; }

/* ---- modal ---- */
.modal{ position:fixed; inset:0; z-index:95; display:none; align-items:center; justify-content:center; padding:20px; }
.modal.open{ display:flex; }
.modal-c{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); width:min(760px,100%); max-height:88vh; display:flex; flex-direction:column; position:relative; z-index:2; }
.modal-h{ padding:15px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.modal-h h3{ margin:0; font-size:15px; font-weight:600; }
.modal-b{ padding:18px; overflow-y:auto; }
.modal-f{ padding:12px 18px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }
.drop{
  border:2px dashed var(--border-strong); border-radius:12px; padding:32px 20px; text-align:center;
  cursor:pointer; background:var(--surface-2);
}
.drop.over{ border-color:var(--accent); background:var(--accent-soft); }
.drop svg{ width:34px;height:34px;color:var(--ink-3); margin-bottom:9px; }
.drop b{ display:block; font-size:14px; margin-bottom:4px; }
.drop span{ font-size:12px; color:var(--ink-3); }

/* ---- notifications ---- */
.notif{
  position:absolute; top:calc(100% + 8px); right:0; width:min(400px,92vw); background:var(--surface);
  border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); z-index:80;
  display:none; max-height:440px; overflow-y:auto;
}
.notif.open{ display:block; }
.notif-h{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600; position:sticky; top:0; background:var(--surface); }
.notif-i{ display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; text-align:left; width:100%; background:transparent; border-left:0;border-right:0;border-top:0; }
.notif-i:hover{ background:var(--surface-2); }
.notif-i .ni{ flex:none; width:24px;height:24px;border-radius:7px; display:grid;place-items:center; font-size:11px; }
.notif-i .nt{ font-size:12.5px; font-weight:600; }
.notif-i .nd{ font-size:11.5px; color:var(--ink-2); }
.hdr-wrap{ position:relative; }

/* toast */
.toasts{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:120; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{
  background:var(--nav-bg); color:#fff; padding:9px 15px; border-radius:9px; font-size:12.5px;
  box-shadow:var(--shadow-lg); display:flex; gap:9px; align-items:center; max-width:90vw;
}
.toast.err{ background:#8B1D1D; }

/* progress/bars */
.barlist{ display:flex; flex-direction:column; gap:9px; }
.barrow{ display:grid; grid-template-columns: 148px 1fr auto; gap:11px; align-items:center; font-size:12.5px; cursor:pointer; }
.barrow:hover .bn{ color:var(--accent); }
.barrow .bn{ overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.barrow .bt{ height:16px; background:var(--surface-3); border-radius:4px; display:flex; overflow:hidden; gap:2px; }
.barrow .bt i{ display:block; height:100%; }
.barrow .bv{ font-weight:600; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }

.qual{ display:flex; flex-direction:column; gap:11px; }
.qrow{ display:grid; grid-template-columns:1fr 88px 52px; gap:11px; align-items:center; font-size:12.5px; }
.qrow .qt{ height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden; }
.qrow .qt i{ display:block; height:100%; background:var(--accent); border-radius:4px; }
.qrow .qv{ font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
.donutwrap{ position:relative; }
.donut-center{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; text-align:center; }
.donut-center .dv{ font-size:26px; font-weight:600; letter-spacing:-.03em; }
.donut-center .dl2{ font-size:11px; color:var(--ink-3); }

.seg{ display:inline-flex; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; background:var(--surface); }
.seg button{ border:0; background:transparent; padding:5px 11px; font-size:12px; cursor:pointer; color:var(--ink-2); }
.seg button + button{ border-left:1px solid var(--border); }
.seg button[aria-pressed="true"]{ background:var(--accent); color:#fff; font-weight:600; }
:root[data-theme="dark"] .seg button[aria-pressed="true"], :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{ color:#0A0E14; }

.subnav{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
.subnav button{ border:1px solid var(--border); background:var(--surface); border-radius:20px; padding:5px 13px; font-size:12.5px; cursor:pointer; }
.subnav button[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:600; }

.tip{
  position:fixed; z-index:200; background:var(--nav-bg); color:#EDF2F8; border-radius:9px;
  padding:9px 11px; font-size:12px; pointer-events:none; box-shadow:var(--shadow-lg);
  max-width:270px; opacity:0; transition:opacity .1s; border:1px solid rgba(255,255,255,.09);
}
.tip.show{ opacity:1; }
.tip b{ display:block; margin-bottom:5px; font-size:12.5px; color:#fff; }
.tip .tr{ display:flex; justify-content:space-between; gap:14px; font-variant-numeric:tabular-nums; }
.tip .tr span:first-child{ color:#9DACBE; }
.tip .tsw{ display:inline-block; width:8px;height:8px;border-radius:2px; margin-right:5px; }

.mobile-only{ display:none; }
.navtoggle{ display:none; }

/* ============================ RESPONSIVE ============================ */
@media (max-width: 1180px){
  :root{ --nav-w: 66px; }
  .nav-brand .brand-text, .nav-item .lbl, .nav-item .cnt, .nav-group, .nav-foot{ display:none; }
  .nav-brand{ justify-content:center; padding:16px 8px; }
  .nav-item{ justify-content:center; padding:10px 0; }
  .nav-item[aria-current="page"]::before{ left:-10px; }
  .hdr-title{ max-width:26%; }
}
@media (max-width: 880px){
  .app{ grid-template-columns: 1fr; }
  .nav{
    position:fixed; left:0; top:0; bottom:0; width:262px; z-index:100;
    transform:translateX(-100%); transition:transform .2s ease;
  }
  :root{ --nav-w: 262px; }
  body.nav-open .nav{ transform:translateX(0); }
  .nav-brand .brand-text, .nav-item .lbl, .nav-item .cnt, .nav-group, .nav-foot{ display:block; }
  .nav-brand{ justify-content:flex-start; padding:18px 16px 16px; }
  .nav-item{ justify-content:flex-start; padding:8px 10px; }
  .navtoggle{ display:grid; }
  .hdr{ padding:9px 13px; gap:9px; }
  .hdr-title{ max-width:none; flex:1; }
  .hdr-date, .gsearch, .hdr-spacer{ display:none; }
  .langsel button{ padding:6px 6px; font-size:10px; }
  .mobile-only{ display:block; }
  .gfilters{ top:58px; padding:8px 13px; overflow-x:auto; flex-wrap:nowrap; }
  .content{ padding:14px 13px 76px; }
  .drawer{ width:100%; }
  .focus-cell{ border-right:0; border-bottom:1px solid var(--border); }
  .kpi .k-val{ font-size:26px; }
}
.bottombar{
  display:none; position:fixed; left:0;right:0;bottom:0; z-index:85; background:var(--surface);
  border-top:1px solid var(--border); padding:5px 3px calc(5px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(5,1fr);
}
@media (max-width:880px){ .bottombar{ display:grid; } }
.bottombar button{
  border:0;background:transparent;cursor:pointer; display:flex;flex-direction:column;align-items:center;
  gap:2px; padding:5px 2px; font-size:9.5px; color:var(--ink-3); border-radius:8px;
}
.bottombar button svg{ width:19px;height:19px; }
.bottombar button[aria-current="page"]{ color:var(--accent); font-weight:600; }
@media print{
  .nav,.hdr,.gfilters,.bottombar,.drawer,.scrim,.modal{ display:none !important; }
  .app{ grid-template-columns:1fr; }
  .content{ padding:0; }
  .card{ break-inside:avoid; box-shadow:none; }
  body{ background:#fff; }

  if (f.statuses.length && f.statuses.indexOf(r.accreditationStatus) < 0) return false;
  if (f.risks.length && f.risks.indexOf(r.riskBand) < 0) return false;
  if (f.years.length) {
    const y = r.dlYear;
    const hitLater = f.years.indexOf('later') >= 0 && y != null && y > 2031;
    if (!(y != null && (f.years.indexOf(y) >= 0 || hitLater))) return false;
  }
  if (f.estYears.length && (r.estYear == null || f.estYears.indexOf(r.estYear) < 0)) return false;
  if (f.reorg === 'yes' && !r.reorganizationDate) return false;
  if (f.reorg === 'no' && r.reorganizationDate) return false;
  if (f.cert === 'yes' && !r.certificateNumber) return false;
  if (f.cert === 'no' && r.certificateNumber) return false;
  if (f.app === 'yes' && !r.applicationDate) return false;
  if (f.app === 'no' && r.applicationDate) return false;
  if (q && r._search.indexOf(q) < 0) return false;
  return true;
}

/* ---------- aggregation ---------- */
function tally(rows) {
  const o = { total: rows.length, active: 0, soon: 0, overdue: 0, progress: 0, nodata: 0, closed: 0, cert: 0, reorg: 0, app: 0, d30: 0, d90: 0, d180: 0, d365: 0, riskHigh: 0, riskMed: 0, riskLow: 0, riskSum: 0 };
  rows.forEach(r => {
    o[r.accreditationStatus]++;
    if (r.certificateNumber) o.cert++;
    if (r.reorganizationDate) o.reorg++;
    if (r.applicationDate) o.app++;
    o['risk' + r.riskBand.charAt(0).toUpperCase() + r.riskBand.slice(1)]++;
    o.riskSum += r.riskScore;
    const d = r.daysRemaining;
    if (d != null && d >= 0) {
      if (d <= 30) o.d30++;
      if (d <= 90) o.d90++;
      if (d <= 182) o.d180++;
      if (d <= 365) o.d365++;
    }
  });
  o.avgRisk = rows.length ? Math.round(o.riskSum / rows.length) : 0;
  return o;
}
function groupBy(rows, keyFn) {
  const m = new Map();
  rows.forEach(r => { const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return m;
}
function completeness(rows) {
  rows = rows.filter(r => !r.liquidated);
  const per = {};
  FIELDS.concat(ID_FIELDS).forEach(f => { per[f] = rows.filter(r => r[f]).length; });
  const totalCells = rows.length * SCORE_FIELDS.length;
  const filled = SCORE_FIELDS.reduce((a, f) => a + per[f], 0);
  return { per, overall: totalCells ? Math.round(filled / totalCells * 1000) / 10 : 0, n: rows.length, incomplete: rows.filter(isIncomplete).length };
}
function deadlineYears(rows) {
  const m = new Map();
  rows.forEach(r => { if (r.dlYear) m.set(r.dlYear, (m.get(r.dlYear) || 0) + 1); });
  return Array.from(m.entries()).sort((a, b) => a[0] - b[0]);
}

/* ---------- misc ---------- */
function statusPill(s, extra) {
  return `<span class="pill" data-s="${s}"><span class="gl" aria-hidden="true">${STATUS_GLYPH[s]}</span>${esc(t('st.' + s))}${extra ? ' · ' + esc(extra) : ''}</span>`;
}
function remainText(r) {
  if (r.accreditationStatus === 'progress' && r.appDays != null) return t('c.inprogressDays', { n: nf(r.appDays) });
  if (r.daysRemaining == null) return '—';
  if (r.daysRemaining < 0) return t('c.overdueBy', { n: nf(-r.daysRemaining) });
  return humanSpan(MODEL.today, r.accreditationDeadline);
}
function toast(msg, isErr) {
  const box = $('#toasts');
  const n = el('div', { class: 'toast' + (isErr ? ' err' : ''), text: msg });
  box.appendChild(n);
  setTimeout(() => { n.style.opacity = '0'; n.style.transition = 'opacity .3s'; setTimeout(() => n.remove(), 320); }, 3200);
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
/* Relative luminance → pick the ink that actually reads on this fill, in either theme. */
function luminance(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return 1;
  const n = parseInt(m[1], 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
    const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
const readableInk = bg => luminance(bg) > 0.32 ? '#0B2036' : '#F2F7FC';
function isDark() {
  const s = document.documentElement.getAttribute('data-theme');
  if (s === 'dark') return true;
  if (s === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

/* ---------------- global search ---------------- */
function wireSearch() {
  const inp = $('#gsearch'), res = $('#gsearchRes'), wrap = $('#gsearchWrap');
  let tmr = null;
  inp.addEventListener('input', () => {
    wrap.classList.toggle('has', !!inp.value);
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      const q = inp.value.trim().toLowerCase();
      res.textContent = '';
      if (q.length < 2) { res.classList.remove('open'); return; }
      const hits = MODEL.rows.filter(r => r._search.indexOf(q) >= 0).slice(0, 12);
      if (!hits.length) { res.appendChild(el('div', { class: 'empty', style: { padding: '18px' }, text: t('c.empty') })); }
      hits.forEach(r => {
        const b = el('button', { type: 'button', onclick: () => { res.classList.remove('open'); openOrg(r.id); } });
        b.innerHTML = esc(r.organizationName) + `<small>${esc(tRegionShort(r.region))} · ${esc(tOwner(r.ownershipType))} · ${esc(fmtDate(r.accreditationDeadline))}</small>`;
        res.appendChild(b);
      });
      res.classList.add('open');
    }, 140);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { res.classList.remove('open'); STATE.search = inp.value; afterFilter(); if (STATE.page !== 'orgs') go('orgs'); }
    if (e.key === 'Escape') { res.classList.remove('open'); inp.blur(); }
  });
  $('#gsearchClr').addEventListener('click', () => { inp.value = ''; wrap.classList.remove('has'); res.classList.remove('open'); STATE.search = ''; afterFilter(); });
}

/* ==========================================================================

const COLS = [

  { k: 'deadline', label: () => t('c.deadline2'), cls: 'mono', get: r => fmtDate(r.accreditationDeadline), sort: r => r.accreditationDeadline || '9999' },
  { k: 'left', label: () => t('c.left'), get: r => remainText(r), sort: r => (r.daysRemaining == null ? 1e9 : r.daysRemaining) },
  { k: 'app', label: () => t('c.app'), cls: 'mono', get: r => fmtDate(r.applicationDate), sort: r => r.applicationDate || '' },
  { k: 'risk', label: () => t('c.risk'), cls: 'num', get: r => r.riskScore, sort: r => r.riskScore, html: r => `<span class="tag risk-${r.riskBand}">${r.riskScore}</span>` },
  { k: 'status', label: () => t('c.status'), get: r => t('st.' + r.accreditationStatus), sort: r => STATUS_ORDER.indexOf(r.accreditationStatus), html: r => statusPill(r.accreditationStatus), fixed: true }
];
const DEFAULT_COLS = ['n', 'name', 'region', 'owner', 'level', 'est', 'reorg', 'acc', 'cert', 'deadline', 'left', 'app', 'status'];

function visibleCols() {
  if (!STATE.table.cols) STATE.table.cols = DEFAULT_COLS.slice();
  return COLS.filter(c => STATE.table.cols.indexOf(c.k) >= 0);
}
function sortRows(rows, key, dir) {
  const col = COLS.find(c => c.k === key);
  const fn = col && col.sort ? col.sort : (r => r.accreditationDeadline || '9999');
  const m = dir === 'desc' ? -1 : 1;
  return rows.slice().sort((a, b) => {
    const x = fn(a), y = fn(b);
    if (x < y) return -1 * m; if (x > y) return 1 * m;
    return a.organizationName.localeCompare(b.organizationName);
  });
}

/**

function renderTable(container, rows, opts) {

  const cols = opts.cols ? COLS.filter(c => opts.cols.indexOf(c.k) >= 0).sort((a, b) => opts.cols.indexOf(a.k) - opts.cols.indexOf(b.k)) : visibleCols();
  const sorted = sortRows(rows, st.sort, st.dir);
  const paginate = opts.paginate !== false;
  const size = paginate ? (st.size || 25) : sorted.length;
  const pages = Math.max(1, Math.ceil(sorted.length / size));
  if (st.page > pages) st.page = pages;
  const start = (st.page - 1) * size;
  const slice = sorted.slice(start, start + size);

  const card = el('div', { class: 'card' });
  if (opts.toolbar !== false) card.appendChild(tableToolbar(rows, opts));

  if (!sorted.length) {
    card.appendChild(el('div', { class: 'empty', html: icon('i-empty', '') + esc(t('c.empty')) }));
    container.appendChild(card);
    return;
  }

  const thead = el('thead');
  const trh = el('tr');
  cols.forEach(c => {
    const th = el('th', { class: (c.cls === 'num' ? 'num ' : '') + (c.sort ? 'sortable' : '') });
    th.innerHTML = esc(c.label()) + (c.sort ? `<span class="sa">${st.sort === c.k ? (st.dir === 'asc' ? '↑' : '↓') : '↕'}</span>` : '');
    if (st.sort === c.k) th.setAttribute('aria-sort', st.dir === 'asc' ? 'ascending' : 'descending');
    if (c.sort) {
      th.tabIndex = 0;
      const doSort = () => { if (st.sort === c.k) st.dir = st.dir === 'asc' ? 'desc' : 'asc'; else { st.sort = c.k; st.dir = 'asc'; } renderPage(); };
      th.addEventListener('click', doSort);
      th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); } });
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);

  const tb = el('tbody');
  slice.forEach((r, i) => {
    const tr = el('tr', { data: { flag: r.accreditationStatus } });
    cols.forEach(c => {
      const td = el('td', { class: c.cls || '' });
      if (c.k === 'n') td.textContent = String(start + i + 1);
      else if (c.k === 'name') td.appendChild(el('button', { class: 'lnk', type: 'button', text: r.organizationName, onclick: () => openOrg(r.id) }));

      else td.textContent = c.get(r, start + i);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  scroll.appendChild(table);
  card.appendChild(scroll);

  if (paginate) card.appendChild(tableFooter(sorted.length, pages, st, size, start, slice.length));

}

function tableFooter(total, pages, st, size, start, shown) {
  const f = el('div', { class: 'tbl-foot' });
  f.appendChild(el('span', { class: 'info num', text: t('m.rowsShown') + ': ' + nf(start + 1) + '–' + nf(start + shown) + ' / ' + nf(total) }));
  const sizeSel = el('select', { style: { padding: '5px 7px', border: '1px solid var(--border)', borderRadius: '6px', background: 'var(--surface)', fontSize: '12px' } });
  [10, 25, 50, 100, 250].forEach(n => sizeSel.appendChild(el('option', { value: n, text: n, selected: n === size })));
  sizeSel.addEventListener('change', () => { st.size = +sizeSel.value; st.page = 1; renderPage(); });
  f.appendChild(el('span', { class: 'info', text: t('c.perpage') }));
  f.appendChild(sizeSel);

  const pager = el('div', { class: 'pager' });
  const mk = (label, p, dis, cur) => el('button', { type: 'button', text: label, disabled: dis, 'aria-current': cur ? 'true' : null, onclick: () => { st.page = p; renderPage(); } });
  pager.appendChild(mk('‹', Math.max(1, st.page - 1), st.page === 1));
  const nums = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - st.page) <= 1) nums.push(p);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  nums.forEach(p => { if (p === '…') pager.appendChild(el('span', { text: '…', style: { padding: '0 3px', color: 'var(--ink-3)' } })); else pager.appendChild(mk(String(p), p, false, p === st.page)); });

  f.appendChild(pager);
  return f;

function openColumns() {

function card(titleText, subText, bodyBuilder, headExtra) {

    c.appendChild(h);

  bodyBuilder(b);
  c.appendChild(b);

}
function kpiTile(tone, labelKey, value, sub, onClick, share) {
  const b = el('button', { class: 'kpi', type: 'button', data: { tone }, onclick: onClick });

}

function monthlySeries(rows, count) {
  const start = new Date(parseISO(MODEL.today).getFullYear(), parseISO(MODEL.today).getMonth(), 1);
  const labels = [], values = [], keys = [];
  const m = new Map();
  rows.forEach(r => { if (r.accreditationDeadline) { const k = r.accreditationDeadline.slice(0, 7); m.set(k, (m.get(k) || 0) + 1); } });
  for (let i = 0; i < count; i++) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    keys.push(k);
    labels.push(monthsShort()[d.getMonth()] + (d.getMonth() === 0 || i === 0 ? " '" + String(d.getFullYear()).slice(2) : ''));
    values.push(m.get(k) || 0);
  }
  return { labels, values, keys };
}

function buildInsights(rows) {
  const tl = tally(rows), all = rows.length;
  const ys = deadlineYears(rows);
  const peak = ys.length ? ys.reduce((a, b) => (b[1] > a[1] ? b : a)) : null;
  const soonRows = rows.filter(r => r.accreditationStatus === 'soon');
  const regM = groupBy(soonRows, r => r.region);
  let topReg = null, topRegN = 0;
  regM.forEach((v, k) => { if (v.length > topRegN) { topRegN = v.length; topReg = k; } });
  const overdueRows = rows.filter(r => r.accreditationStatus === 'overdue');
  const maxOverdue = overdueRows.length ? Math.max.apply(null, overdueRows.map(r => -r.daysRemaining)) : 0;
  const estBasis = rows.filter(r => r.deadlineBasis === 'est').length;
  const withDl = rows.filter(r => r.accreditationDeadline).length;
  const progRows = rows.filter(r => r.accreditationStatus === 'progress' && r.appDays != null);
  const avgApp = progRows.length ? Math.round(progRows.reduce((a, r) => a + r.appDays, 0) / progRows.length) : 0;
  const comp = completeness(rows);
  const dayMap = new Map();
  rows.forEach(r => { if (r.accreditationDeadline && r.daysRemaining >= 0) dayMap.set(r.accreditationDeadline, (dayMap.get(r.accreditationDeadline) || 0) + 1); });
  let clusterDay = null, clusterN = 0;
  dayMap.forEach((v, k) => { if (v > clusterN) { clusterN = v; clusterDay = k; } });
  const B = s => '<b class="num">' + s + '</b>';
  const out = [];
  out.push(t('ins.1', { total: B(nf(all)), n: B(nf(tl.d365)) }));
  if (tl.overdue) out.push(t('ins.2b', { n: B(nf(tl.overdue)), m: B(nf(maxOverdue)) }));
  if (peak) out.push(t('ins.3', { year: B(peak[0]), n: B(nf(peak[1])) }));
  if (topReg) out.push(t('ins.4', { pct: B(pct(topRegN, soonRows.length)), region: '<b>' + esc(tRegion(topReg)) + '</b>' }));
  if (tl.nodata) out.push(t('ins.5', { n: B(nf(tl.nodata)) }));
  if (estBasis) out.push(t('ins.9', { pct: B(pct(estBasis, withDl)) }));
  if (tl.progress) out.push(t('ins.6', { n: B(nf(tl.progress)), d: B(nf(avgApp)) }));
  if (tl.riskHigh) out.push(t('ins.7', { n: B(nf(tl.riskHigh)), pct: B(pct(tl.riskHigh, all)) }));
  if (clusterN >= 20) out.push(t('ins.10', { n: B(nf(clusterN)), d: B(fmtDate(clusterDay)) }));
  if (tl.closed) out.push(t('ins.11', { n: B(nf(tl.closed)) }));
  out.push(t('ins.8', { pct: B(comp.overall) }));
  return out;
}

/* ============================ REGIONS ============================ */
function regionStats(rows) {
  const m = groupBy(rows, r => r.region);
  const keys = REGION_ORDER.filter(k => m.has(k)).concat(Array.from(m.keys()).filter(k => REGION_ORDER.indexOf(k) < 0 && k));
  return keys.map(k => {
    const list = m.get(k) || [];
    const tl = tally(list);
    const own = {}; OWNER_ORDER.forEach(o => own[o] = list.filter(r => r.ownershipType === o).length);
    const lvl = {}; LEVEL_ORDER.forEach(l => lvl[l] = list.filter(r => r.educationLevel === l).length);
    return { key: k, label: tRegion(k), short: tRegionShort(k), rows: list, n: list.length, counts: tl, own, lvl };
  });
}
function viewRegions(root) {
  const rows = filtered();
  const stats = regionStats(rows);
  const max = Math.max.apply(null, stats.map(s => s.n).concat([1]));
  /* quantile bins — one dominant region (Tashkent city) would otherwise flatten the whole ramp */
  const ranked = stats.slice().sort((a, b) => a.n - b.n);
  const binOf = {};
  ranked.forEach((s, i) => { binOf[s.key] = s.n === 0 ? 0 : Math.min(7, 1 + Math.floor(i / ranked.length * 6.99)); });

  /* schematic tile cartogram §7 */
  root.appendChild(card(t('ch.map'), t('ch.mapNote') + ' · ' + t('ch.mapNote2'), b => {
    const wrap = el('div', { class: 'map-wrap' });
    const grid = el('div', { class: 'tilemap' });
    stats.forEach(s => {
      const pos = REGION_TILE[s.key];
      const rampIdx = binOf[s.key];
      const bg = cssVar('--seq-' + rampIdx) || '#CDE2FB';
      const btn = el('button', {
        class: 'tile' + (STATE.filters.regions.indexOf(s.key) >= 0 ? ' sel' : ''), type: 'button',
        style: pos ? { gridColumn: String(pos[0]), gridRow: pos[1] + ' / span ' + pos[2], background: bg } : { background: bg },
        onclick: () => setFilterAndGo('regions', s.key, 'orgs')
      });
      const ink = readableInk(bg);
      btn.innerHTML =
        `<span class="tn" style="color:${ink}">${esc(s.short)}</span>` +
        `<span class="tv" style="color:${ink}">${nf(s.n)}</span>` +
        `<span class="tstrip">${STATUS_ORDER.map(st => s.counts[st] ? `<i style="width:${s.counts[st] / s.n * 100}%;background:${STATUS_COLOR[st]}"></i>` : '').join('')}</span>`;
      attachTip(btn, () => `<b>${esc(s.label)}</b>` + tipRows([
        [t('c.total'), nf(s.n)],
        [t('st.active'), nf(s.counts.active), STATUS_COLOR.active],
        [t('st.soon'), nf(s.counts.soon), STATUS_COLOR.soon],
        [t('st.overdue'), nf(s.counts.overdue), STATUS_COLOR.overdue],
        [t('st.progress'), nf(s.counts.progress), STATUS_COLOR.progress],
        [t('st.nodata'), nf(s.counts.nodata), STATUS_COLOR.nodata],
        [t('m.state'), nf(s.own.Davlat)],
        [t('m.nonstate'), nf(s.own.Nodavlat)],
        [t('m.foreign'), nf(s.own.Xorijiy)]
      ]));
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
    b.appendChild(wrap);
    const sc = el('div', { class: 'mapscale' });
    sc.innerHTML = `<span>0</span><span class="ramp">${[1, 2, 3, 4, 5, 6, 7].map(i => `<i style="background:${cssVar('--seq-' + i)}"></i>`).join('')}</span><span class="num">${nf(max)}</span>
      <span style="margin-left:12px">${esc(t('c.orgs'))} · ${esc(t('m.schematic'))}</span>`;
    b.appendChild(sc);
  }));

  const g2 = el('div', { class: 'grid g-2 mt mb' });
  g2.appendChild(card(t('ch.byRegion'), t('ch.clickHint'), b => {
    const items = stats.slice().sort((a, b2) => b2.n - a.n).map(s => ({ label: s.short, n: s.n, v: s.key }));
    hBar(b, items, 'reg_bar', it => setFilterAndGo('regions', it.v, 'orgs'), 'h420');
  }));
  g2.appendChild(card(t('ch.regionStatus'), t('ch.clickHint'), b => {
    const cats = stats.slice().sort((a, b2) => b2.n - a.n).map(s => ({ label: s.short, counts: s.counts, key: s.key }));
    stackedStatus(b, cats, 'reg_stack', (c, s) => { STATE.filters.regions = [c.key]; STATE.filters.statuses = [s]; renderFilters(); go('orgs'); }, true, 'h420');
  }));
  root.appendChild(g2);

/* ==========================================================================
   AKKREDITATSIYA GRAFIGI — interaktiv Gantt uslubidagi tarmoq timeline (§10–12)
   ========================================================================== */
const TL_DEFAULT_FROM = 2020, TL_DEFAULT_TO = 2030;   // standart koʻrinish: 2020–2030
/* Grafikdagi hududlar ketma-ketligi (buyurtmachi talabi) */
const TL_REGION_ORDER = ["Qoraqalpog'iston Respublikasi", 'Andijon viloyati', 'Buxoro viloyati', "Farg'ona viloyati", 'Jizzax viloyati',
  'Namangan viloyati', 'Navoiy viloyati', 'Qashqadaryo viloyati', 'Samarqand viloyati', 'Sirdaryo viloyati', 'Surxondaryo viloyati',
  'Toshkent viloyati', 'Xorazm viloyati', 'Toshkent shahri'];
function tlRange() {
  const from = STATE.timeline.from || TL_DEFAULT_FROM;
  const to = STATE.timeline.to || TL_DEFAULT_TO;
  return { from, to, startISO: from + '-01-01', endISO: to + '-12-31' };
}
function tlPos(iso, R) {
  const a = daysBetween(R.startISO, R.endISO), d = daysBetween(R.startISO, iso);
  if (a == null || d == null) return null;
  return Math.max(-2, Math.min(102, d / a * 100));
}
function tlGroupKey(r) {
  const g = STATE.timeline.group;
  if (g === 'region') return r.region || '—';
  if (g === 'level') return r.educationLevel || '—';
  if (g === 'owner') return r.ownershipType || '—';
  if (g === 'status') return r.accreditationStatus;
  return 'all';
}
function tlGroupLabel(k) {
  const g = STATE.timeline.group;
  if (g === 'region') return tRegion(k);
  if (g === 'level') return tLevel(k);
  if (g === 'owner') return tOwner(k);
  if (g === 'status') return t('st.' + k);
  return t('c.total');
}

function viewTimeline(root) {
  const rows = filtered();
  const R = tlRange();

  /* ---- control bar ---- */
  const ctrl = el('div', { class: 'card mb' });
  const ch = el('div', { class: 'card-h', style: { flexWrap: 'wrap', gap: '8px' } });
  const tt = el('div');
  tt.appendChild(el('h3', { text: t('tl.title') }));
  tt.appendChild(el('p', { text: nf(rows.length) + ' ' + t('c.orgs') + ' · ' + t('tl.scrollHint') }));
  ch.appendChild(tt);
  ch.appendChild(el('div', { class: 'sp' }));

  const grpSeg = el('div', { class: 'seg' });
  [['region', 'tl.groupRegion'], ['level', 'tl.groupLevel'], ['owner', 'tl.groupOwner'], ['status', 'tl.groupStatus'], ['none', 'c.nogroup']].forEach(([g, k]) => {
    grpSeg.appendChild(el('button', {
      type: 'button', text: t(k), 'aria-pressed': String(STATE.timeline.group === g),
      onclick: () => { STATE.timeline.group = g; STATE.timeline.collapsed = {}; renderPage(); }
    }));
  });
  ch.appendChild(el('span', { class: 'gf-label', text: t('c.groupby') }));
  ch.appendChild(grpSeg);

  const yrSeg = el('div', { class: 'seg' });
  yrSeg.appendChild(el('button', { type: 'button', text: '−', title: '-1', onclick: () => { STATE.timeline.from = R.from - 1; STATE.timeline.to = R.to; renderPage(); } }));
  yrSeg.appendChild(el('button', { type: 'button', text: R.from + ' – ' + R.to, onclick: () => { STATE.timeline.from = null; STATE.timeline.to = null; renderPage(); } }));
  yrSeg.appendChild(el('button', { type: 'button', text: '+', title: '+1', onclick: () => { STATE.timeline.from = R.from; STATE.timeline.to = R.to + 1; renderPage(); } }));
  ch.appendChild(el('span', { class: 'gf-label', text: t('tl.range') }));
  ch.appendChild(yrSeg);

  ch.appendChild(el('button', { class: 'btn sm', type: 'button', text: t('tl.expandAll'), onclick: () => { STATE.timeline.collapsed = {}; renderPage(); } }));
  ch.appendChild(el('button', {
    class: 'btn sm', type: 'button', text: t('tl.collapseAll'), onclick: () => {
      const c = {}; rows.forEach(r => c[tlGroupKey(r)] = true); STATE.timeline.collapsed = c; renderPage();
    }
  }));
  ctrl.appendChild(ch);

  /* legend — colour is never the only channel: each status also carries a glyph */
  const lg = el('div', { class: 'legend', style: { padding: '10px 16px' } });
  STATUS_ORDER.forEach(s => {
    const b = el('button', { type: 'button', onclick: () => toggleStatusFilter(s) });
    b.innerHTML = `<span class="sw" style="background:${STATUS_COLOR[s]};border-radius:50%"></span><span style="font-size:9px;color:${STATUS_COLOR[s]}">${STATUS_GLYPH[s]}</span> ${esc(t('st.' + s))}`;
    lg.appendChild(b);
  });
  ctrl.appendChild(lg);
  root.appendChild(ctrl);

  /* ---- the chart ---- */
  const cardBox = el('div', { class: 'card' });
  const wrap = el('div', { class: 'tl-wrap' });
  const inner = el('div', { class: 'tl-inner', style: { minWidth: Math.max(940, (R.to - R.from + 1) * 150) + 'px' } });   // har bir yil uchun kamida 150px

  /* axis */
  const axis = el('div', { class: 'tl-axis' });
  for (let y = R.from; y <= R.to; y++) {
    const yr = el('div', { class: 'yr' });
    yr.appendChild(document.createTextNode(String(y)));
    const q = el('div', { class: 'q' }); q.textContent = 'I · II · III · IV';
    yr.appendChild(q);
    axis.appendChild(yr);
  }
  inner.appendChild(axis);

  /* group + rows */
  let shown = 0, hidden = 0;
  const LIMIT = STATE.timeline.limit;
  const groups = new Map();
  rows.forEach(r => { const k = tlGroupKey(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  const orderedKeys = Array.from(groups.keys()).sort((a, b) => {
    const g = STATE.timeline.group;
    if (g === 'region') return TL_REGION_ORDER.indexOf(a) - TL_REGION_ORDER.indexOf(b);
    if (g === 'level') return LEVEL_ORDER.indexOf(a) - LEVEL_ORDER.indexOf(b);
    if (g === 'owner') return OWNER_ORDER.indexOf(a) - OWNER_ORDER.indexOf(b);
    if (g === 'status') return STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b);
    return 0;
  });

  const nowPos = tlPos(MODEL.today, R);
  const yearCount = R.to - R.from + 1;

  orderedKeys.forEach(gk => {
    const list = groups.get(gk).slice().sort((a, b) => {
      const x = a.accreditationDeadline || '9999', y = b.accreditationDeadline || '9999';
      return x < y ? -1 : x > y ? 1 : 0;
    });
    if (STATE.timeline.group !== 'none') {
      const collapsed = !!STATE.timeline.collapsed[gk];
      const gwrap = el('div', { class: 'tl-group' });
      const gb = el('button', { type: 'button', onclick: () => { STATE.timeline.collapsed[gk] = !collapsed; renderPage(); } });
      const tl2 = tally(list);
      gb.innerHTML = `<span style="transform:rotate(${collapsed ? -90 : 0}deg);display:inline-block;transition:transform .12s">▾</span>
        <span>${esc(tlGroupLabel(gk))}</span>
        <span class="cnt">${nf(list.length)}
          <span style="color:${STATUS_COLOR.overdue}">■${tl2.overdue}</span>
          <span style="color:${STATUS_COLOR.soon}">▲${tl2.soon}</span>
          <span style="color:${STATUS_COLOR.progress}">◆${tl2.progress}</span>
        </span>`;
      gwrap.appendChild(gb);
      inner.appendChild(gwrap);
      if (collapsed) return;
    }
    list.forEach(r => {
      if (shown >= LIMIT) { hidden++; return; }
      shown++;
      inner.appendChild(tlRow(r, R, nowPos, yearCount));
    });
  });

  if (!rows.length) inner.appendChild(el('div', { class: 'empty', html: icon('i-empty', '') + esc(t('c.empty')) }));
  wrap.appendChild(inner);
  cardBox.appendChild(wrap);
  if (hidden) cardBox.appendChild(el('div', { class: 'tbl-foot', html: `<span class="info">${esc(t('tl.limit', { n: LIMIT }))}</span>` }));
  root.appendChild(cardBox);
}

function tlRow(r, R, nowPos, yearCount) {
  const row = el('div', { class: 'tl-row' });
  const st = r.accreditationStatus;
  const lab = el('div', { class: 'tl-lab' });
  lab.innerHTML = `<span style="color:${STATUS_COLOR[st]};font-size:9px;flex:none">${STATUS_GLYPH[st]}</span>`;
  const nm = el('span', { class: 'nm', text: r.organizationName, title: r.organizationName, tabindex: '0', role: 'button' });
  nm.addEventListener('click', () => openOrg(r.id));
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') openOrg(r.id); });
  lab.appendChild(nm);
  row.appendChild(lab);

  const track = el('div', { class: 'tl-track' });
  for (let i = 1; i < yearCount; i++) track.appendChild(el('div', { class: 'gl', style: { left: (i / yearCount * 100) + '%' } }));
  if (nowPos != null && nowPos >= 0 && nowPos <= 100) track.appendChild(el('div', { class: 'gl now', style: { left: nowPos + '%' }, title: t('c.today') }));

  const dlISO = r.accreditationDeadline;

  /* ---- JARAYONDA: ariza sanasidan boshlanadigan chiziq ----
     Yorliq "Jarayonda {ariza sanasi}" ariza nuqtasidan chapda, chiziq esa ariza sanasidan
     bugungi kungacha davom etadi. Agar avvalgi akkreditatsiya muddati ariza sanasidan oldin
     tugagan boʻlsa, u oʻz tugash sanasi bilan alohida (chapda) chiziladi. */
  if (st === 'progress' && r.applicationDate) {
    const appISO = r.applicationDate;
    const appIn = appISO >= R.startISO && appISO <= R.endISO;
    const ap = appIn ? tlPos(appISO, R) : (appISO < R.startISO ? 0 : 100);
    const dp = dlISO ? (dlISO >= R.startISO && dlISO <= R.endISO ? tlPos(dlISO, R) : (dlISO < R.startISO ? 0 : 100)) : null;
    /* muddat tugashi va jarayon boshlanishi kesishsa yoki juda yaqin boʻlsa — chiziqlar bir-biriga ulanadi */
    const joined = dp != null && dp >= ap - 5;   // 5% ≈ 80px: yorliqlar sigʻmaydigan yaqinlik
    const tipRowsFor = () => tipRows([
      [t('c.status'), t('st.progress'), STATUS_COLOR.progress],
      [t('c.app'), fmtDate(appISO)],
      dlISO ? [t('c.deadline2'), fmtDate(dlISO)] : null,
      dlISO ? [t('c.basis'), t('basis.' + r.deadlineBasis)] : null,
      [t('c.region'), tRegionShort(r.region)],
      [t('c.owner'), tOwner(r.ownershipType)],
      [t('c.risk'), r.riskScore + ' / 100']
    ]);
    /* 1) avvalgi muddat (bor boʻlsa): qizil/kulrang chiziq, tugash sanasi markeri ustida */
    if (dlISO) {
      const endedBefore = dlISO < appISO;
      const tone = endedBefore ? STATUS_COLOR.overdue : STATUS_COLOR.nodata;
      const anchor0 = r.reorganizationDate || r.accreditationDate || r.establishmentDate;
      let s0 = anchor0 ? tlPos(anchor0, R) : 0; if (s0 == null || s0 < 0) s0 = 0;
      if (dp > s0) track.appendChild(el('div', { class: 'tl-bar', style: { left: s0 + '%', width: Math.max(0.6, dp - s0) + '%', background: tone, borderRadius: joined ? '4px 0 0 4px' : '4px' } }));
      const dmk = el('button', { class: 'tl-mk', type: 'button', style: { left: dp + '%', background: tone }, 'aria-label': r.organizationName + ' — ' + fmtDate(dlISO) });
      dmk.addEventListener('click', () => openOrg(r.id));
      attachTip(dmk, () => `<b>${esc(r.organizationName)}</b>` + tipRowsFor());
      track.appendChild(dmk);
      /* tugash sanasi: ulangan boʻlsa — ranglar qoʻshilgan nuqta ustida; aks holda — avvalgidek marker yonida */
      if (joined) track.appendChild(el('div', { class: 'tl-dt tl-dt-top', style: { left: dp + '%', color: tone }, text: fmtDate(dlISO) }));
      else track.appendChild(el('div', { class: 'tl-dt', style: { left: 'calc(' + dp + '% + 12px)', color: tone }, text: fmtDate(dlISO) }));
    }
    /* 2) jarayon chizigʻi: (ulangan boʻlsa — tugash nuqtasidan, aks holda ariza sanasidan) → bugun */
    const bs = joined ? dp : ap;
    const ep = (nowPos != null && nowPos > bs) ? nowPos : bs + 0.8;
    track.appendChild(el('div', { class: 'tl-bar', style: { left: bs + '%', width: Math.max(0.8, ep - bs) + '%', background: STATUS_COLOR.progress, opacity: '.6', borderRadius: joined ? '0 4px 4px 0' : '4px' } }));
    if (!joined) {
      const amk = el('button', { class: 'tl-mk', type: 'button', style: { left: ap + '%', background: STATUS_COLOR.progress }, 'aria-label': r.organizationName + ' — ' + t('st.progress') + ' ' + fmtDate(appISO) });
      amk.addEventListener('click', () => openOrg(r.id));
      attachTip(amk, () => `<b>${esc(r.organizationName)}</b>` + tipRowsFor());
      track.appendChild(amk);
    }
    /* "Jarayonda {ariza sanasi}" — chiziq tugagandan keyin */
    const lblStyle = ep <= 84
      ? { left: 'calc(' + ep + '% + 10px)', color: STATUS_COLOR.progress }
      : { left: ep + '%', transform: 'translate(-100%,-125%)', color: STATUS_COLOR.progress };
    track.appendChild(el('div', { class: 'tl-dt', style: lblStyle, text: t('st.progress') + ' ' + fmtDate(appISO) }));
    row.appendChild(track);
    return row;
  }

  if (!dlISO) {
    track.appendChild(el('div', { class: 'tl-off', style: { left: '6px' }, text: t('m.noDeadlineShort') }));
    row.appendChild(track);
    return row;
  }
  const p = tlPos(dlISO, R);
  const inRange = dlISO >= R.startISO && dlISO <= R.endISO;
  if (!inRange) {
    const left = dlISO < R.startISO;
    track.appendChild(el('div', {
      class: 'tl-off', style: left ? { left: '6px' } : { right: '6px' },
      html: `<span style="color:${STATUS_COLOR[st]}">${left ? '◀' : '▶'}</span> <span class="mono">${fmtDate(dlISO)}</span> · ${esc(t('tl.outOfRange'))}`
    }));
    row.appendChild(track);
    return row;
  }
  /* leading bar: from the anchor date (accreditation / reorg / establishment) to the deadline */
  const anchor = r.reorganizationDate || r.accreditationDate || r.establishmentDate;
  let barStart = anchor ? tlPos(anchor, R) : 0;
  if (barStart == null || barStart < 0) barStart = 0;
  const w = Math.max(0.6, p - barStart);
  track.appendChild(el('div', { class: 'tl-bar', style: { left: barStart + '%', width: w + '%', background: STATUS_COLOR[st] } }));

  const mk = el('button', { class: 'tl-mk', type: 'button', style: { left: p + '%', background: STATUS_COLOR[st] }, 'aria-label': r.organizationName + ' — ' + fmtDate(dlISO) });
  mk.addEventListener('click', () => openOrg(r.id));
  attachTip(mk, () => `<b>${esc(r.organizationName)}</b>` + tipRows([
    [t('c.status'), t('st.' + st), STATUS_COLOR[st]],
    [t('c.deadline2'), fmtDate(dlISO)],
    [t('c.left'), remainText(r)],
    [t('c.basis'), t('basis.' + r.deadlineBasis)],
    [t('c.region'), tRegionShort(r.region)],
    [t('c.owner'), tOwner(r.ownershipType)],
    r.applicationDate ? [t('c.app'), fmtDate(r.applicationDate)] : null,
    [t('c.risk'), r.riskScore + ' / 100']
  ]));
  track.appendChild(mk);

  const labelRight = p < 78;
  const dt = el('div', {
    class: 'tl-dt',
    style: labelRight ? { left: 'calc(' + p + '% + 12px)' } : { right: 'calc(' + (100 - p) + '% + 12px)' },
    text: st === 'progress' ? (t('st.progress') + ' · ' + fmtDate(dlISO)) : fmtDate(dlISO)
  });
  track.appendChild(dt);
  row.appendChild(track);
  return row;
}

/* ============================ MASTER REGISTRY §20 ============================ */

/* ============================ UPCOMING §15 ============================ */
const UP_TABS = [{ id: 'd30', n: 30 }, { id: 'd90', n: 90 }, { id: 'd180', n: 182 }, { id: 'd365', n: 365 }];
let upTab = 'd90';
function viewUpcoming(root) {
  const rows = filtered().filter(r => r.daysRemaining != null && r.daysRemaining >= 0);
  const g = el('div', { class: 'grid g-4 mb' });
  UP_TABS.forEach(tab => {
    const n = rows.filter(r => r.daysRemaining <= tab.n).length;
    const b = kpiTile(tab.id === 'd30' ? 'overdue' : (tab.id === 'd90' ? 'soon' : 'neutral'), 'up.' + tab.id, n, '', () => { upTab = tab.id; renderPage(); });
    b.id = 'upTab_' + tab.id;
    if (upTab === tab.id) b.style.outline = '2px solid var(--accent)';
    g.appendChild(b);
  });
  root.appendChild(g);

  const lim = UP_TABS.find(x => x.id === upTab).n;
  const list = rows.filter(r => r.daysRemaining <= lim).sort((a, b) => a.daysRemaining - b.daysRemaining);

  root.appendChild(card(t('ch.byMonth'), t('ch.clickHint'), b => {
    const m = new Map();
    list.forEach(r => { const k = r.accreditationDeadline.slice(0, 7); m.set(k, (m.get(k) || 0) + 1); });
    const keys = Array.from(m.keys()).sort();
    vBar(b, keys.map(k => ({ label: monthsShort()[+k.slice(5, 7) - 1] + " '" + k.slice(2, 4), n: m.get(k), key: k })), 'up_mo',
      it => { STATE.filters.years = [+it.key.slice(0, 4)]; renderFilters(); go('orgs'); }, 'h240');
  }));
  root.appendChild(el('div', { class: 'mb' }));
  renderTable(root, list, {
    title: t('up.' + upTab), subtitle: nf(list.length) + ' ' + t('c.orgs') + ' · ' + t('m.byDeadlineAsc'),
    cols: ['n', 'name', 'region', 'owner', 'level', 'deadline', 'left', 'app', 'risk', 'status'],
    state: forceSort('deadline', 'asc')
  });
}
function forceSort(key, dir) {
  if (!STATE.table._forced || STATE.table._forced !== key) { STATE.table.sort = key; STATE.table.dir = dir; STATE.table._forced = key; }
  return STATE.table;
}

  const sc = el('div', { class: 'tbl-scroll' });
  const table = el('table', { class: 'tbl' });
  table.innerHTML = `<thead><tr>
    <th class="num">№</th><th>${esc(t('c.org'))}</th><th>${esc(t('c.certno'))}</th>
    <th>${esc(t('c.acc'))}</th><th>${esc(t('c.certtill'))}</th>
