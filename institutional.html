/* ============================ FORECAST §23 / §37 ============================ */
function viewForecast(root) {
  const rows = filtered();
  const cy = +MODEL.today.slice(0, 4);
  const years = [];
  for (let y = cy; y <= cy + 5; y++) years.push(y);
  const byYear = {}; years.forEach(y => byYear[y] = rows.filter(r => r.dlYear === y));
  const past = rows.filter(r => r.dlYear != null && r.dlYear < cy);

  const g = el('div', { class: 'grid g-4 mb' });
  const peakY = years.reduce((a, y) => byYear[y].length > byYear[a].length ? y : a, years[0]);
  g.appendChild(kpiTile('total', 'fc.total', rows.filter(r => r.dlYear != null).length, t('c.deadline2'), () => { }));
  g.appendChild(kpiTile('soon', 'fc.peak', byYear[peakY].length, String(peakY) + ' · ' + t('c.orgs'), () => setFilterAndGo('years', peakY, 'orgs')));
  g.appendChild(kpiTile('overdue', 'fc.past', past.length, '< ' + cy, () => setFilterAndGo('statuses', 'overdue', 'overdue')));
  const load = Math.round(years.reduce((a, y) => a + byYear[y].length, 0) / 72 * 10) / 10;
  const avgTile = kpiTile('neutral', 'fc.avg', load, t('c.orgs') + ' / ' + t('m.month').toLowerCase(), () => { });
  avgTile.querySelector('.k-val').textContent = String(load).replace('.', ',');
  g.appendChild(avgTile);
  root.appendChild(g);

  root.appendChild(card(t('ch.workload'), t('ch.clickHint'), b => {
    const ys = deadlineYears(rows);
    vBar(b, ys.map(([y, n]) => ({ label: String(y), n, year: y, color: y < cy ? STATUS_COLOR.overdue : (y === cy ? STATUS_COLOR.soon : cssVar('--seq-4')) })),
      'fc_year', it => setFilterAndGo('years', it.year, 'orgs'), 'h320');
  }));
  root.appendChild(el('div', { class: 'mb' }));

  /* year planner matrix §37 */
  root.appendChild(card(t('ch.matrix'), t('ch.clickHint'), b => {
    const maxCell = Math.max(1, ...years.map(y => [1, 2, 3, 4].map(q => byYear[y].filter(r => r.dlQuarter === q).length)).flat());
    const table = el('table', { class: 'matrix' });
    const th = el('thead');
    th.innerHTML = `<tr><th></th><th>${esc(t('m.q1'))}</th><th>${esc(t('m.q2'))}</th><th>${esc(t('m.q3'))}</th><th>${esc(t('m.q4'))}</th><th>${esc(t('c.total'))}</th></tr>`;
    table.appendChild(th);
    const tb = el('tbody');
    years.forEach(y => {
      const tr = el('tr');
      tr.appendChild(el('td', { class: 'yl', text: y }));
      [1, 2, 3, 4].forEach(q => {
        const list = byYear[y].filter(r => r.dlQuarter === q);
        const ratio = list.length / maxCell;
        const idx = list.length === 0 ? 0 : Math.min(7, 1 + Math.floor(ratio * 6.99));
        const td = el('td', { class: 'cell' });
        const btn = el('button', {
          type: 'button', style: { background: cssVar('--seq-' + idx), color: readableInk(cssVar('--seq-' + idx)) },
          text: nf(list.length),
          onclick: () => { if (!list.length) return; STATE.filters.years = [y]; renderFilters(); showQuarter(y, q, list); }
        });
        attachTip(btn, () => `<b>${y} · ${esc(t('m.q' + q))}</b>` + tipRows([
          [t('c.total'), nf(list.length)],
          [t('st.overdue'), nf(list.filter(r => r.accreditationStatus === 'overdue').length), STATUS_COLOR.overdue],
          [t('st.progress'), nf(list.filter(r => r.accreditationStatus === 'progress').length), STATUS_COLOR.progress]
        ]));
        td.appendChild(btn);
        tr.appendChild(td);
      });
      tr.appendChild(el('td', { class: 'tot num', text: nf(byYear[y].length) }));
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    b.appendChild(table);
  }));
  root.appendChild(el('div', { class: 'mb' }));

  /* calendar heatmap year × month §22.7 */
  root.appendChild(card(t('ch.heatmap'), t('ch.clickHint'), b => {
    const ys = Array.from(new Set(rows.filter(r => r.dlYear).map(r => r.dlYear))).sort((a, b2) => a - b2);
    const counts = {};
    let maxc = 1;
    ys.forEach(y => { counts[y] = new Array(12).fill(0); });
    rows.forEach(r => { if (r.dlYear) { counts[r.dlYear][r.dlMonth - 1]++; maxc = Math.max(maxc, counts[r.dlYear][r.dlMonth - 1]); } });
    const wrap = el('div', { style: { overflowX: 'auto' } });
    const grid = el('div', { class: 'hm' });
    grid.appendChild(el('div', { class: 'hh' }));
    monthsShort().forEach(mn => grid.appendChild(el('div', { class: 'hh', text: mn })));
    ys.forEach(y => {
      grid.appendChild(el('div', { class: 'hy', text: y }));
      for (let mi = 0; mi < 12; mi++) {
        const n = counts[y][mi];
        const idx = n === 0 ? 0 : Math.min(7, 1 + Math.floor(n / maxc * 6.99));
        const btn = el('button', {
          type: 'button', text: n || '', style: { background: cssVar('--seq-' + idx), color: readableInk(cssVar('--seq-' + idx)) },
          onclick: () => { if (!n) return; const list = rows.filter(r => r.dlYear === y && r.dlMonth === mi + 1); showQuarter(y, null, list, months()[mi] + ' ' + y); }
        });
        attachTip(btn, () => `<b>${esc(months()[mi])} ${y}</b>` + tipRows([[t('c.orgs'), nf(n)]]));
        grid.appendChild(btn);
      }
    });
    wrap.appendChild(grid);
    b.appendChild(wrap);
  }));
}
function showQuarter(y, q, list, titleOverride) {
  const body = el('div');
  const sorted = list.slice().sort((a, b) => (a.accreditationDeadline || '').localeCompare(b.accreditationDeadline || ''));
  body.appendChild(el('div', { class: 'tbl-scroll' }, [miniTable(sorted.slice(0, 200))]));
  if (sorted.length > 200) body.appendChild(el('p', { class: 'info', style: { padding: '10px 2px 0', color: 'var(--ink-3)', fontSize: '12px' }, text: t('m.moreRows', { n: sorted.length - 200 }) }));
  openModal(titleOverride || (y + ' · ' + t('m.q' + q) + ' — ' + nf(list.length) + ' ' + t('c.orgs')), body, [
    el('button', {
      class: 'btn pri', type: 'button', text: t('m.viewOrgs'), onclick: () => {
        STATE.filters.years = [y]; closeModal(); renderFilters(); go('orgs');
      }
    })
  ]);
}

/* ============================ CALENDAR §24 ============================ */
function viewCalendar(root) {
  const rows = filtered().filter(r => r.accreditationDeadline);
  const cy = +MODEL.today.slice(0, 4);
  if (!STATE.calYear) STATE.calYear = cy;
  const y = STATE.calYear;
  const yearsAvail = Array.from(new Set(rows.map(r => r.dlYear))).sort((a, b) => a - b);

  const nav = el('div', { class: 'subnav' });
  yearsAvail.forEach(yy => nav.appendChild(el('button', {
    type: 'button', text: yy, 'aria-pressed': String(yy === y),
    onclick: () => { STATE.calYear = yy; renderPage(); }
  })));
  root.appendChild(nav);

  const byDay = {};
  rows.filter(r => r.dlYear === y).forEach(r => { (byDay[r.accreditationDeadline] = byDay[r.accreditationDeadline] || []).push(r); });
  const yearCount = rows.filter(r => r.dlYear === y).length;

  root.appendChild(card(y + ' — ' + t('page.calendar'), nf(yearCount) + ' ' + t('c.orgs'), b => {
    const grid = el('div', { class: 'cal-grid' });
    for (let mi = 0; mi < 12; mi++) {
      const mo = el('div', { class: 'cal-mo' });
      const cnt = rows.filter(r => r.dlYear === y && r.dlMonth === mi + 1).length;
      mo.appendChild(el('h4', { html: esc(months()[mi]) + `<span class="num">${cnt || ''}</span>` }));
      const days = el('div', { class: 'cal-days' });
      WEEKDAYS[LANG].forEach(w => days.appendChild(el('div', { class: 'dh', text: w })));
      const first = new Date(y, mi, 1);
      let lead = (first.getDay() + 6) % 7;
      for (let i = 0; i < lead; i++) days.appendChild(el('div'));
      const dim = new Date(y, mi + 1, 0).getDate();
      for (let d = 1; d <= dim; d++) {
        const iso = y + '-' + String(mi + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const list = byDay[iso] || [];
        const cell = el(list.length ? 'button' : 'div', { class: 'cal-d' + (list.length ? ' has' : '') + (iso === MODEL.today ? ' today' : ''), text: d, type: list.length ? 'button' : null });
        if (list.length) {
          const worst = list.reduce((a, r) => STATUS_ORDER.indexOf(r.accreditationStatus) < STATUS_ORDER.indexOf(a.accreditationStatus) ? r : a, list[0]);
          const col = STATUS_COLOR[worst.accreditationStatus];
          cell.style.background = col + '2E';
          cell.style.boxShadow = 'inset 0 -3px 0 ' + col;

/* ==========================================================================
   IMPORT / EXPORT §25–26
   ========================================================================== */
const HEADER_RULES = [
  { f: 'reorg', re: /qayta\s*tashkil|реорганиз|reorganiz/ },
  { f: 'est', re: /tashkil\s*etilgan|дата\s*созд|образован|establish|ta'?sis/ },
  { f: 'app', re: /ariza|заявк|application/ },
  { f: 'cert', re: /sertifikat\s*raqam|сертификат.*номер|номер.*сертификат|certificate\s*(no|number)|^ot\b|guvohnoma\s*raqam/ },
  { f: 'acc', re: /akkreditatsiya.*(sana|o'?tkaz|otkaz)|(sana|дата).*аккредит|аккредит.*дата|accredit.*date|o'?tkazilgan\s*sana|^sanasi$/ },
  { f: 'name', re: /tt\s*nomi|tashkilot.*nom|nomi|наимен|назван|organization|institution|name/ },
  { f: 'region', re: /hudud|вило|регион|област|region/ },
  { f: 'own', re: /mulkchilik|собствен|ownership/ },
  { f: 'lvl', re: /daraja|уровень|level|ta'?lim\s*turi/ },
  { f: 'id', re: /^t\/?r$|^№$|^no$|^n$|^#$|тартиб/ }
];
const normHdr = s => String(s == null ? '' : s).toLowerCase().replace(/[‘’`ʻ´]/g, "'").replace(/\s+/g, ' ').trim();

/** Does this row look like a sub-header row (the second line of a merged group header)? */
function looksLikeSubRow(main, sub) {
  const nonEmpty = r => (r || []).filter(v => normHdr(v)).length;
  const nMain = nonEmpty(main), nSub = nonEmpty(sub);
  if (!nSub || !nMain) return false;
  if (nSub * 2 >= nMain) return false;                 /* sub-headers under merged groups are sparse */
  return (sub || []).every(v => {                       /* and every filled cell must read as a header */
    const l = normHdr(v);
    return !l || HEADER_RULES.some(r => r.re.test(l));
  });
}
/**
 * Finds the header row in a sheet given as an array of arrays and maps columns → model fields.
 * A merged group header ("Akkreditatsiyadan o'tkazilgan sana va sertifikat raqami") spanning two
 * columns is resolved by its own sub-headers ("Sanasi" / "Sertifikat raqami") FIRST, so the
 * accreditation date and the certificate number never swap places.
 */
function mapHeaders(aoa) {
  let best = { score: -1, row: 0, map: {}, subRow: false, labels: [] };
  const limit = Math.min(12, aoa.length);
  for (let h = 0; h < limit; h++) {
    const main = aoa[h] || [], sub = aoa[h + 1] || [];
    const isSub = looksLikeSubRow(main, sub);
    const width = Math.max(main.length, isSub ? sub.length : 0);
    const primary = [], combined = [];
    let carry = '';
    for (let c = 0; c < width; c++) {
      const a = normHdr(main[c]);
      const b = isSub ? normHdr(sub[c]) : '';
      if (a) carry = a;
      primary[c] = b || a;                               /* sub-header wins where it exists */
      combined[c] = ((a || carry) + ' ' + b).trim();     /* merged parent carried rightwards */
    }
    const map = {};
    let score = 0;
    /* pass 1 — the most specific label for each column */
    primary.forEach((label, c) => {
      if (!label) return;
      for (const rule of HEADER_RULES) {
        if (rule.re.test(label) && map[rule.f] == null) { map[rule.f] = c; score++; break; }
      }
    });
    /* pass 2 — fields still unfilled may be named only by the merged parent */
    combined.forEach((label, c) => {
      if (!label || Object.keys(map).some(f => map[f] === c)) return;
      for (const rule of HEADER_RULES) {
        if (rule.re.test(label) && map[rule.f] == null) { map[rule.f] = c; score++; break; }
      }
    });
    if (map.name != null) score += 3;
    if (score > best.score) best = { score, row: h, map, subRow: isSub, labels: primary };
  }
  return best;
}
function aoaToRows(aoa) {
  const H = mapHeaders(aoa);
  if (H.map.name == null) return { error: 'io.errCol', header: H };
  const start = H.row + (H.subRow ? 2 : 1);
  const out = [], problems = [];
  const seen = {};
  for (let i = start; i < aoa.length; i++) {
    const r = aoa[i] || [];
    const name = String(r[H.map.name] == null ? '' : r[H.map.name]).replace(/\s+/g, ' ').trim();
    const anyVal = r.some(v => v !== null && v !== undefined && String(v).trim() !== '');
    if (!anyVal) continue;
    if (!name) { problems.push({ row: i + 1, key: 'io.errEmpty', detail: '' }); continue; }
    const rec = { name };
    ['region', 'own', 'lvl', 'cert'].forEach(f => { rec[f] = H.map[f] != null ? String(r[H.map[f]] == null ? '' : r[H.map[f]]).replace(/\s+/g, ' ').trim() : ''; });
    ['est', 'reorg', 'acc', 'app'].forEach(f => {
      if (H.map[f] == null) { rec[f] = null; return; }
      const raw = r[H.map[f]];
      const iso = coerceDate(raw);
      const txt = raw == null ? '' : String(raw).trim();
      if (!iso && txt && LIQUIDATED_RE.test(txt)) { rec.liq = 1; rec[f] = null; return; }
      if (txt && !iso) problems.push({ row: i + 1, key: 'io.errDate', detail: name.slice(0, 40) + ' \u00b7 ' + txt.slice(0, 24) });
      rec[f] = iso;
    });
    rec.id = H.map.id != null && r[H.map.id] != null ? String(r[H.map.id]) : String(out.length + 1);
    const nk = name.toLowerCase();
    if (seen[nk]) problems.push({ row: i + 1, key: 'io.errDup', detail: name.slice(0, 50) });
    seen[nk] = true;
    out.push(rec);
  }
  return { rows: out, problems, header: H };
}
function csvToAoa(text) {
  const rows = []; let row = [], cur = '', q = false;
  const delim = (text.split('\n')[0].split(';').length > text.split('\n')[0].split(',').length) ? ';' : ',';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function handleFile(file) {
  STATE._pendingName = file.name;
  const isCsv = /\.csv$/i.test(file.name);
  const rd = new FileReader();
  rd.onerror = () => toast(t('io.parseErr'), true);
  rd.onload = e => {
    try {
      let aoa;
      if (isCsv) aoa = csvToAoa(String(e.target.result));
      else {
        if (typeof XLSX === 'undefined') { toast(t('io.libErr'), true); return; }
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
      }
      const parsed = aoaToRows(aoa);
      if (parsed.error) { toast(t(parsed.error), true); return; }
      showImportPreview(parsed, file.name);
    } catch (err) { console.error(err); toast(t('io.parseErr') + ': ' + err.message, true); }
  };
  if (isCsv) rd.readAsText(file, 'utf-8'); else rd.readAsArrayBuffer(file);
}

    fmtDate(r.applicationDate), r.riskScore, t('st.' + r.accreditationStatus)
  ]);
  return { head, body, rows };
}
function fileStamp() {
  const f = STATE.filters, bits = [];
  if (f.regions.length === 1) bits.push(tRegionShort(f.regions[0]));
  if (f.owners.length === 1) bits.push(tOwner(f.owners[0]));
  if (f.levels.length === 1) bits.push(tLevel(f.levels[0]));
  if (f.statuses.length === 1) bits.push(t('st.' + f.statuses[0]));
  if (f.years.length === 1) bits.push(String(f.years[0]));
  return ('akkreditatsiya_' + (bits.join('_') || 'barchasi') + '_' + MODEL.today).replace(/[^\wЀ-ӿ\-]+/g, '_');
}
function openExport() {
  const { rows } = exportRows();
  const body = el('div');
  body.appendChild(el('p', { text: t('io.exportNote'), style: { margin: '0 0 6px', fontSize: '13px' } }));
  body.appendChild(el('p', { class: 'num', text: t('f.result') + ': ' + nf(rows.length) + ' ' + t('c.orgs'), style: { margin: '0 0 16px', fontWeight: '600' } }));
  const chips = el('div', { class: 'chips', style: { marginBottom: '16px' } });
  filterChips().forEach(c => chips.appendChild(c));
  body.appendChild(chips);
  const g = el('div', { class: 'grid g-3' });
  g.appendChild(el('button', { class: 'btn', type: 'button', html: icon('i-down', '') + esc(t('io.exXlsx')), onclick: () => { doExportXlsx(); closeModal(); } }));
  g.appendChild(el('button', { class: 'btn', type: 'button', html: icon('i-down', '') + esc(t('io.exCsv')), onclick: () => { doExportCsv(); closeModal(); } }));
  g.appendChild(el('button', { class: 'btn', type: 'button', html: icon('i-print', '') + esc(t('io.exPdf')), onclick: () => { closeModal(); setTimeout(() => window.print(), 120); } }));
  body.appendChild(g);
  openModal(t('c.export'), body, [el('button', { class: 'btn', type: 'button', text: t('c.close'), onclick: closeModal })]);
}
function filterChips() {
  const f = STATE.filters, out = [];
  const push = (label, clear) => {
    const c = el('span', { class: 'chip', text: label });
    c.appendChild(el('button', { type: 'button', text: '×', 'aria-label': t('f.clear'), onclick: () => { clear(); afterFilter(); closeModal(); } }));
    out.push(c);
  };
  f.regions.forEach(v => push(tRegionShort(v), () => f.regions.splice(f.regions.indexOf(v), 1)));
  f.levels.forEach(v => push(tLevel(v), () => f.levels.splice(f.levels.indexOf(v), 1)));
  f.owners.forEach(v => push(tOwner(v), () => f.owners.splice(f.owners.indexOf(v), 1)));
  f.statuses.forEach(v => push(t('st.' + v), () => f.statuses.splice(f.statuses.indexOf(v), 1)));
  f.years.forEach(v => push(String(v === 'later' ? t('f.later') : v), () => f.years.splice(f.years.indexOf(v), 1)));
  f.risks.forEach(v => push(t('risk.' + v), () => f.risks.splice(f.risks.indexOf(v), 1)));
  if (f.reorg) push(t('f.reorg') + ': ' + (f.reorg === 'yes' ? t('f.yes') : t('f.no')), () => f.reorg = null);
  if (f.cert) push(t('f.cert') + ': ' + (f.cert === 'yes' ? t('f.has') : t('f.hasnot')), () => f.cert = null);
  if (f.app) push(t('f.app') + ': ' + (f.app === 'yes' ? t('f.appyes') : t('f.appno')), () => f.app = null);
  if (STATE.search.trim()) push('“' + STATE.search.trim() + '”', () => { STATE.search = ''; const gi = $('#gsearch'); if (gi) gi.value = ''; });
  if (!out.length) out.push(el('span', { class: 'chip', text: t('f.all') }));
  return out;
}
function doExportCsv() {
  const { head, body } = exportRows();
  const q = v => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [head].concat(body).map(r => r.map(q).join(';')).join('\r\n');
  download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), fileStamp() + '.csv');
  toast(t('io.exported'));
}
function doExportXlsx() {
  if (typeof XLSX === 'undefined') { doExportCsv(); toast(t('io.libErr'), true); return; }
  const { head, body } = exportRows();
  const ws = XLSX.utils.aoa_to_sheet([head].concat(body));
  ws['!cols'] = head.map((h, i) => ({ wch: i === 1 ? 52 : Math.max(12, String(h).length + 2) }));
  ws['!freeze'] = { xSplit: 0, ySplit: 1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Akkreditatsiya');
  const sum = summarySheet();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'Xulosa');
  XLSX.writeFile(wb, fileStamp() + '.xlsx');
  toast(t('io.exported'));
}
function summarySheet() {
  const rows = filtered(), tl = tally(rows), comp = completeness(rows);
  const out = [[t('brand.title')], [t('c.today'), fmtDate(MODEL.today)], []];
  out.push([t('c.status'), t('c.count'), t('c.share') + ', %']);
  STATUS_ORDER.forEach(s => out.push([t('st.' + s), tl[s], pct(tl[s], tl.total)]));
  out.push([t('c.total'), tl.total, 100], []);
  out.push([t('c.region'), t('c.total'), t('st.active'), t('st.soon'), t('st.overdue'), t('st.progress'), t('st.nodata')]);
  regionStats(rows).forEach(s => out.push([s.label, s.n, s.counts.active, s.counts.soon, s.counts.overdue, s.counts.progress, s.counts.nodata]));
  out.push([]);
  out.push([t('ch.workload')]);
  deadlineYears(rows).forEach(([y, n]) => out.push([y, n]));
  out.push([], [t('q.completeness'), comp.overall + '%']);
  return out;
}

/* ==========================================================================
   BOOT — sahifa dispetcheri, hodisalar, ishga tushirish
   ========================================================================== */
const VIEWS = {
  home: viewHome, orgs: viewOrgs, regions: viewRegions, levels: viewLevels, owners: viewOwners,
  timeline: viewTimeline, upcoming: viewUpcoming, overdue: viewOverdue, progress: viewProgress,
  certs: viewCerts, forecast: viewForecast, calendar: viewCalendar, quality: viewQuality, settings: viewSettings
};
function renderPage() {
  killCharts(); hideTip();
  const root = $('#content');
  root.textContent = '';
  const intro = el('div', { class: 'page-intro' });
  intro.appendChild(el('h2', { text: t('page.' + STATE.page) }));
  intro.appendChild(el('p', { text: t('sub.' + STATE.page) }));
  root.appendChild(intro);

  const n = activeFilterCount();
  if (n) {
    const bar = el('div', { class: 'chips mb' });
    filterChips().forEach(c => bar.appendChild(c));
    bar.appendChild(el('button', { class: 'btn sm', type: 'button', text: t('f.clear'), onclick: () => { clearFilters(); afterFilter(); } }));
    root.appendChild(bar);
  }
  (VIEWS[STATE.page] || viewHome)(root);
  const info = $('.gf-label.num', $('#gfilters'));
  if (info) info.textContent = t('f.result') + ': ' + nf(filtered().length) + ' / ' + nf(MODEL.rows.length);
}

function rebuild() {
  MODEL = buildModel(SRC_ROWS);
  STATE.today = MODEL.today;
  STATE.calYear = null;
  renderNav(); renderHeader(); renderFilters(); renderPage();
}

/* ---- embed rejimi: ?embed=1&page=orgs&lang=ul&theme=light ---- */
const EMBED = (() => {
  const q = new URLSearchParams(location.search);
  if (q.get('embed') !== '1') return null;
  return { page: q.get('page') || 'orgs', lang: q.get('lang') || 'ul', theme: q.get('theme') || 'light' };
})();

function boot() {
  /* restore preferences */
  try {
    const l = localStorage.getItem('acc.lang'); if (l && LIDX[l] != null) { STATE.lang = l; LANG = l; }
    const th = localStorage.getItem('acc.theme'); if (th) STATE.theme = th;
  } catch (e) { }
  if (EMBED) {
    document.body.classList.add('embed');
    if (LIDX[EMBED.lang] != null) { STATE.lang = EMBED.lang; LANG = EMBED.lang; }
    STATE.theme = EMBED.theme === 'dark' ? 'dark' : 'light';
    if (PAGES.some(p => p.id === EMBED.page)) STATE.page = EMBED.page;
    /* Dashboard'dan oʻtishda qoʻllanadigan filtrlar: f_status, f_region, f_level, f_owner (vergul bilan), org=ID */
    const q = new URLSearchParams(location.search);
    const list = k => (q.get(k) || '').split(',').map(s => s.trim()).filter(Boolean);
    EMBED.filters = { statuses: list('f_status'), regions: list('f_region'), levels: list('f_level'), owners: list('f_owner') };
    EMBED.org = q.get('org') || null;
    window.addEventListener('message', e => {
      const d = e.data || {};
      if (d.theme === 'dark' || d.theme === 'light') setTheme(d.theme);
      if (d.lang && LIDX[d.lang] != null && d.lang !== STATE.lang) setLang(d.lang);   // asosiy platformadan til oʻzgarishi
      if (d.a11y && typeof d.a11y === 'object') {                                      // maxsus imkoniyatlar sinxroni
        const h = document.documentElement;
        h.classList.toggle('reduce-motion', !!d.a11y.motion);
        if (d.a11y.contrast) h.setAttribute('data-contrast', d.a11y.contrast); else h.removeAttribute('data-contrast');
        document.body.style.zoom = d.a11y.zoom ? String(d.a11y.zoom) : '';
      }
    });
  }
  if (STATE.theme !== 'auto') document.documentElement.setAttribute('data-theme', STATE.theme);
  document.documentElement.lang = LANGS.find(x => x.id === STATE.lang).locale;

  SRC_ROWS = RAW_DATA.slice();
  MODEL = buildModel(SRC_ROWS);
  STATE.today = MODEL.today;
  STATE.table.cols = DEFAULT_COLS.slice();
  if (EMBED && EMBED.filters) {
    const F = EMBED.filters;
    if (F.statuses.length) STATE.filters.statuses = F.statuses.filter(s => STATUS_ORDER.includes(s));
    if (F.regions.length) STATE.filters.regions = F.regions.map(canonRegion).filter(Boolean);
    if (F.levels.length) STATE.filters.levels = F.levels.map(canonLevel).filter(Boolean);
    if (F.owners.length) STATE.filters.owners = F.owners.map(canonOwner).filter(Boolean);
  }

  renderNav(); renderHeader(); renderFilters(); renderPage();
  wireSearch();
  if (EMBED && EMBED.org && MODEL.rows.some(r => r.id === EMBED.org)) setTimeout(() => openOrg(EMBED.org), 400);

  /* header controls */
  $('#themeBtn').addEventListener('click', () => setTheme(isDark() ? 'light' : 'dark'));
  $('#navToggle').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#scrim').addEventListener('click', () => { closeDrawer(); document.body.classList.remove('nav-open'); });
  $('#bellBtn').addEventListener('click', e => {
    e.stopPropagation();
    const p = $('#notifPanel'), open = p.classList.toggle('open');
    $('#bellBtn').setAttribute('aria-expanded', String(open));
  });
  $('#notifPanel').addEventListener('click', e => e.stopPropagation());
  $('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleFile(f); e.target.value = ''; });

  document.addEventListener('click', () => { $$('.ms-pop.open').forEach(p => p.classList.remove('open')); closeNotif(); $('#gsearchRes').classList.remove('open'); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeModal(); closeNotif(); $$('.ms-pop.open').forEach(p => p.classList.remove('open')); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); const g = $('#gsearch'); if (g) { g.focus(); g.select(); } }
    if ((e.ctrlKey || e.metaKey) && e.key === 'p') { /* let the browser print the page */ }
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (STATE.theme === 'auto') { renderHeader(); renderPage(); } });

  /* midnight roll-over: recompute so "today" is never stale (§34) */
  setInterval(() => {
    const now = todayISO();
    if (now !== MODEL.today) rebuild();
  }, 60000);

  /* Chart.js may arrive after first paint (deferred CDN) — repaint once when it does */
  if (!hasChartJs()) {
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      if (hasChartJs()) { clearInterval(iv); renderPage(); }
      else if (tries > 40) clearInterval(iv);
    }, 250);
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
